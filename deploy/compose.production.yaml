# The one deployment, as an overlay on compose.yaml rather than a second copy of it.
#
# `COMPOSE_FILE=compose.yaml:deploy/compose.production.yaml` in .env makes plain `docker compose`
# commands pick both up, so nothing on the box has to remember a -f flag — including the systemd
# unit, which is the caller that would forget it at three in the morning.
#
# What this adds is only what a public host needs and a laptop does not: TLS in front, an updater
# behind, and no published port at all. What the application IS stays in compose.yaml, which is the
# file to read.

services:
  web:
    # The image comes from GHCR, built by .github/workflows/publish.yml from main. `!reset` drops
    # the base file's build stanza: a server that can compile the site is a server that can serve a
    # binary nobody attested, and the repository is cloned here for its compose files rather than as
    # a build tree.
    build: !reset null
    pull_policy: always

    # NOTHING IS PUBLISHED. Caddy reaches this over the compose network, and the base file's
    # 8080 mapping is dropped rather than narrowed, because Docker writes its port rules ahead of
    # ufw: a published port is reachable from the internet whatever the host firewall was told, and
    # the safest number of ports to argue about is none. `docker compose exec web` is the way in.
    ports: !override []

    environment:
      # Cloudflare, then Caddy. Both append to X-Forwarded-For, so the middleware walks exactly two
      # hops and takes the address Cloudflare actually saw — a client that forges the header has its
      # value pushed out of reach rather than believed. Getting this number wrong in either direction
      # is a rate limit that either buckets the whole internet together or hands out a bucket per
      # forged header.
      Submissions__TrustedProxyHops: "2"

      # A crash dump, written somewhere the restart cannot lose it. The heap ceiling that mem_limit
      # implies (below) turns a runaway into a managed OutOfMemoryException rather than a SIGKILL
      # from the kernel, and an unhandled one of those is a crash the runtime describes on its way
      # out — which is the only artefact that would name the allocation. %p is the PID, and in a
      # container that is always 1, so each crash overwrites the last dump rather than filling the
      # disk with a series of them.
      DOTNET_DbgEnableMiniDump: "1"
      DOTNET_DbgMiniDumpType: "2"
      DOTNET_DbgMiniDumpName: "/dumps/muindex-%p.dmp"

    # **A ceiling, because on 2026-08-18 there was not one.** This process went from its steady
    # 350-450 MB to 3.3 GB inside a single ten-minute window and took all 3.7 GiB of the host with
    # it, twice needing a reboot from the provider's console. Without a limit the kernel's only
    # lever is the page cache, so it evicted every executable page on the box — sshd's included —
    # and the host stopped answering SSH at the same moment the site stopped answering requests.
    # Losing the way in is what made a container's bug an outage.
    #
    # This does not fix the allocation, which is still unidentified. It fixes the blast radius:
    # the cgroup kills this container, Docker restarts it, and SSH answers throughout.
    #
    # 2g is a little over four times the steady working set. It is also the number .NET reads —
    # Server GC sizes its budgets against the whole machine when it finds no cgroup limit and
    # against 75% of the limit when it finds one, so this line is what puts a 1.5 GB ceiling on the
    # managed heap and what makes the failure a catchable exception instead of a SIGKILL.
    mem_limit: 2g
    # Equal to mem_limit, so this container cannot spill into the host's swap. That swap is margin
    # for sshd and the kernel to stay responsive *while* this container dies; lending it to the
    # process being killed would spend the one thing it was added to protect.
    memswap_limit: 2g

    volumes:
      # The base file's key ring, restated. Compose merges service volumes by mount target, so this
      # is a duplicate that collapses rather than a second mount — and writing it out means the
      # overlay is still correct if that rule is ever the other one. Dropping the ring by accident
      # would sign every operator out on the next restart, which is too quiet a failure to risk on
      # a merge semantic.
      - keys:/home/app/.aspnet
      # Crash dumps, which the read-only root filesystem has nowhere to put. Overwritten in place.
      - dumps:/dumps

    # The only container Watchtower is allowed to touch. See below.
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  postgres:
    # Deliberately unlabelled, and this is the load-bearing half of the label scheme. An automatic
    # update here would one day pull a new major version, which refuses to start against an existing
    # data directory — the catalogue is the asset (rule 3) and it does not get surprise surgery.
    # Postgres is upgraded by hand, with a dump taken first.
    labels:
      com.centurylinklabs.watchtower.enable: "false"

    # Nine times its steady 86 MB. The point of a limit here is not that Postgres is suspected of
    # anything — it is that after the web container was capped, it would otherwise be the next
    # process able to take the host down, and the whole argument above applies to whichever one
    # that is. A SIGKILL here is a crash, and a crash is a case Postgres is built for: it replays
    # the WAL on the restart that `restart: unless-stopped` gives it.
    mem_limit: 768m
    memswap_limit: 768m

  caddy:
    image: caddy:2-alpine
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The Cloudflare Origin CA certificate for the proxied names. Not publicly trusted and not
      # meant to be: it is presented to Cloudflare, which is the only thing that reaches this port
      # for those names, and it is what makes Full (strict) an honest setting rather than a label.
      - ./deploy/tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
      # The access log, which the Caddyfile writes here rather than to stdout. On stdout it would
      # share the container log with everything else and be rotated out by volume; here it is a
      # file with its own bounded history, which is what makes it answerable after an outage.
      - caddy-logs:/var/log/caddy
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      # Only for the ACME account behind crawler.mu-index.com, which is DNS-only and therefore gets
      # an ordinary Let's Encrypt certificate over HTTP-01.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      CRAWLER_DOMAIN: ${CRAWLER_DOMAIN:?set CRAWLER_DOMAIN in .env}
    restart: unless-stopped

  watchtower:
    # Pinned rather than :latest. The thing that updates everything else is the one container whose
    # own version should change when somebody decides it does.
    image: containrrr/watchtower:1.7.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Registry credentials, if the image is private. Empty is fine: an anonymous pull of a public
      # package needs nothing here, and `docker login ghcr.io` on the host fills it in.
      - /root/.docker:/config:ro
    environment:
      DOCKER_CONFIG: /config

      # Only labelled containers, which is exactly one of them. Without this, Watchtower updates
      # everything it can see, including the database.
      WATCHTOWER_LABEL_ENABLE: "true"

      # Five minutes. The interval is a poll against GHCR for a changed digest, not a pull, so it is
      # cheap; what it costs is that a merge to main reaches the public site within five minutes with
      # no human in between. That is a deliberate choice and the reason the SHA tags exist.
      WATCHTOWER_POLL_INTERVAL: "300"

      # The old image after a successful swap. Without it a long-lived host slowly fills with
      # untagged layers, which is a disk-full at an hour nobody chose.
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      TZ: ${TZ:-Etc/UTC}
    mem_limit: 64m
    memswap_limit: 64m
    restart: unless-stopped

  # Capped for the same reason as the rest, and no more than that — the sidecar has sat at 75 MB
  # since it was started. It keeps the mudlist cache in memory, which is the one thing here that
  # grows with somebody else's network rather than with our own traffic.
  i3:
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  dumps:
