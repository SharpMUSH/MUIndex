# A local or single-box run: one Postgres, one MUIndex. `docker compose up --build`, or
# `podman compose up --build`, and the site is on http://localhost:8080.
#
# This file is not a hosting decision. Spec §15.3 — hosting and the cost envelope, which is what
# bounds probe frequency and retention — is open, and nothing here presumes an answer to it. It is
# the smallest arrangement that makes the deployable serve measured data, and it is what a reader
# should be able to run before choosing anything.

name: muindex

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: muindex
      POSTGRES_USER: muindex
      # Local only. A real deployment passes a secret it did not read out of a file in git.
      POSTGRES_PASSWORD: ${MUI_POSTGRES_PASSWORD:-muindex}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # The site applies migrations before it serves a request, so it must not start against a
      # Postgres that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U muindex -d muindex"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  web:
    build:
      context: .
    image: ghcr.io/sharpmush/muindex:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The one variable that decides whether this deployment shows measurements or a fixture.
      # Unset it and the site still starts — on the demo fixture, saying so on every page.
      MUI_POSTGRES: Host=postgres;Port=5432;Database=muindex;Username=muindex;Password=${MUI_POSTGRES_PASSWORD:-muindex}

      # Day one only: §7.1's effective seed set is every game ever found, and seeding is idempotent,
      # so leaving this set across restarts does not drag anything forward. Whitespace or commas.
      MUI_CRAWL_SEEDS: ${MUI_CRAWL_SEEDS:-}

      # false makes a replica a pure web tier. The advisory lock already guarantees one crawler
      # across N replicas, so this is a choice about *where* the crawl runs, not a safety net.
      MUI_CRAWL_ENABLED: ${MUI_CRAWL_ENABLED:-true}

      # §11: where an admin who has just been dialled can read what we do and ask us to stop. The
      # compiled default is a placeholder that answers nobody — deliberately, because a default
      # naming one deployment's contact page would make every other deployment announce it — so a
      # container that crawls for real sets this. /about says which of the two it is holding.
      MUI_CRAWL_INFO_URL: ${MUI_CRAWL_INFO_URL:-}

      # Passkeys are bound to this name and every credential registered under one value has to be
      # registered again if it moves. §15.1 is settled — mu-index.com — but this stays a setting:
      # the registrable domain is the deployment's, not the code's. Leave it unset locally, where
      # sign-in is the only surface it affects.
      # The Intermud-3 pass, off unless said out loud — and it needs the `i3` sidecar, which is behind
      # its own compose profile. Turning both on is two deliberate acts because between them they
      # connect to a public network and register a name there permanently.
      MUI_I3_ENABLED: ${MUI_I3_ENABLED:-false}
      MUI_I3_GATEWAY: ${MUI_I3_GATEWAY:-i3:8081}
      MUI_I3_API_KEY: ${MUI_I3_API_KEY:-}

      # The AresCentral pass: one authenticated GET an hour against the AresMUSH community hub's
      # documented API. On when both halves of the credential pair are set and off when they are
      # not, so a deployment that was never issued one is unchanged and never logs a 401 on a loop.
      # Credentials come from AresCentral's maintainer and belong in the environment, never in here.
      MUI_ARES_CLIENT_ID: ${MUI_ARES_CLIENT_ID:-}
      MUI_ARES_API_KEY: ${MUI_ARES_API_KEY:-}

      Passkeys__ServerDomain: ${MUI_PASSKEY_DOMAIN:-}

      # The shared bearer secret for /mcp — the authenticated MCP endpoint that replaces the
      # ssh/scp/mui-crawl administration dance. Unset means the endpoint refuses every request rather
      # than accepting any (fail closed); MUI.Web logs a warning at startup while it is unset. Generate
      # one with `openssl rand -hex 32` and set it in .env, never here.
      MUI_MCP_TOKEN: ${MUI_MCP_TOKEN:-}

      ASPNETCORE_ENVIRONMENT: Production
    ports:
      # An interface may be written into this value — MUI_PORT=127.0.0.1:8080 publishes to loopback
      # only — and on a host with a reverse proxy in front, it must be. Docker writes its own
      # iptables rules ahead of a host firewall, so a published port is reachable from the internet
      # whatever ufw was told, and the site would answer on 8080 beside the proxy that terminates
      # its TLS. See docs/deploy.md; the default stays whole-host so that `compose up` on a laptop
      # is reachable from the phone next to it.
      - "${MUI_PORT:-8080}:8080"
    # Nothing is written to the container filesystem; every write this process makes goes to
    # Postgres. Saying so here means a write that appears later fails loudly instead of landing
    # somewhere a restart discards.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # ASP.NET Core's data protection key ring, which holds sign-in cookies and antiforgery tokens.
      # HOME is /home/app in the image, so the ring lands in here. Without it the keys are ephemeral
      # and an operator is signed out by every restart — and, with a second replica, by every other
      # request.
      - keys:/home/app/.aspnet
    restart: unless-stopped

  # The Intermud-3 side door. Off unless a profile asks for it, because joining I3 registers a name
  # on somebody else's network permanently and that must never happen as a side effect of
  # `compose up`. Start it with `--profile i3`.
  #
  # It exists because 56% of the games we sample cannot be counted through the telnet probe: WHO is
  # not a connect-screen command outside the TinyMUD lineage, and the LP family — which is most of
  # what is dark — has no MSSP tradition either. I3's who-reply carries the user array itself, so the
  # count is the length of a list rather than a pattern match on a stranger's ASCII art.
  #
  # This is a Python sidecar and not our code (github.com/LuminariMUD/Intermud3, v0.4.7-beta). It
  # owns the mudmode framing, the I3v3 handshake, the router password and the mudlist cache, and
  # hands us JSON-RPC. What it does not own is any of the integration: the mudlist rows and the
  # counts are ours to put in Postgres.
  i3:
    profiles: ["i3"]
    build:
      # **Pinned to a commit, not to a branch.** `#main` was a moving target on the one container
      # that holds our router password and speaks to a public network: every rebuild would have
      # taken whatever upstream had merged that morning, unreviewed, with no way to say afterwards
      # which code had been running. This is the revision the interoperability run was made against.
      #
      # Moving it is a deliberate act — read the diff, run a pass against the test router if it is
      # up, then change this line. Watchtower cannot do it: this container is unlabelled and
      # WATCHTOWER_LABEL_ENABLE is on, so nothing updates it but a person.
      context: https://github.com/LuminariMUD/Intermud3.git#e1f2800fa82e0c14878c3f8643d7b17d7498493b
    image: i3-gateway:e1f2800
    volumes:
      # Our identity, not theirs — see the header of that file for why it replaces rather than
      # layers over the gateway's own config.
      - ./deploy/i3/config.yaml:/app/config/config.yaml:ro
      # **Not disposable.** The router assigns a password on first connect and the gateway persists
      # it here. Lose this volume and the next startup-req-3 goes out with password 0, which is a
      # re-registration rather than a reconnect.
      - i3state:/app/state
    environment:
      MUD_NAME: ${MUI_I3_NAME:-MUIndex}
      MUD_PORT: "0"
      # §11's obligation in the network's own vocabulary: an admin who finds MUIndex in their
      # who-log reaches a person. **No default, and not in this file** — the same reason
      # MUI_CRAWL_INFO_URL has none. A contact address compiled into the tree is one deployment's
      # address announced by every fork, every laptop and every reader of the repository; this one
      # belongs to whoever runs the deployment and it comes from their environment. Unlike the mud
      # name, it is rewritten by every startup-req-3, so changing it costs a reconnect.
      MUD_ADMIN_EMAIL: ${MUI_I3_ADMIN_EMAIL:-}
      MUD_STATUS: "n/a"
      MUD_TYPE: "n/a"
      # *i4 rather than *dalet or *wpr: it is the router the gateway's own interoperability run was
      # made against. The documented test router *wir (…:3004) is unreachable — *wpr answers on the
      # same address at 8080 — so there was no rehearsal to be had.
      I3_ROUTER_NAME: ${MUI_I3_ROUTER_NAME:-*i4}
      I3_ROUTER_HOST: ${MUI_I3_ROUTER_HOST:-204.209.44.3}
      I3_ROUTER_PORT: ${MUI_I3_ROUTER_PORT:-8080}
      I3_GATEWAY_SECRET: ${MUI_I3_SECRET:-}

      # The same value the web container authenticates with, and it has to be passed in here too:
      # deploy/i3/config.yaml substitutes ${MUI_I3_API_KEY} inside this container, so leaving it out
      # resolved it to empty and the site could never have signed in. Two different secrets, and
      # they must not be set to one value — I3_GATEWAY_SECRET signs the gateway's own tokens, this
      # one is the caller's credential.
      MUI_I3_API_KEY: ${MUI_I3_API_KEY:-}
      LOG_LEVEL: ${MUI_I3_LOG_LEVEL:-INFO}

    # **The gateway refuses to start without a .env file, even though it does not need one.** Its
    # entrypoint declares `--env-file` as `click.Path(exists=True)` with a default of `.env`, so
    # click validates the default before the code's own `if env_file.exists()` guard is ever
    # reached; upstream's own compose mounts the file to satisfy it. Ours has nothing to put in one
    # — every setting arrives in `environment:` above, where compose can interpolate it from .env on
    # the host — so this points the flag at a file that exists and holds nothing.
    #
    # Not caught before production because the gateway was run by hand from a checkout that happened
    # to contain a .env, which is a different program from the one the container runs.
    command: ["python", "-m", "src", "--env-file", "/dev/null"]

    # Deliberately unpublished. The gateway's API has one shared secret and no per-caller
    # authorisation worth the name, so the only thing that should be able to reach it is the web
    # container on the compose network. Its 8080 is its own and does not collide with the site's.
    expose:
      - "8080"
      - "8081"
    healthcheck:
      # /health/ready is router-authenticated readiness — it goes green when the handshake has
      # completed, not merely when Python has started — which is the condition the crawler needs.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres:
  keys:
  i3state:
