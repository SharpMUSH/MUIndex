name: CI

on:
  push:
    branches: [main]
  # No branch filter: PRs are frequently stacked, so a branch's PR is often based on the branch
  # below it rather than on main. Filtering to `branches: [main]` gave every stacked PR an empty
  # checks tab — the one place the build signal is actually needed before a merge.
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # CI restores the whole solution, so it cannot notice a project the image's own restore layer
      # is missing — that only fails after merge, in the publish workflow, with production left on
      # a stale image. This is the check that moves that failure back to the pull request.
      - name: Check the image's restore layer covers what it builds
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/check-image-restore.py

      # Same class of failure, different file: Compose forwards only what its `environment:` map
      # names, so a documented setting nothing forwards is a knob that silently does nothing. There
      # is no error to read, which is why it needs a check rather than a test.
      - name: Check compose forwards every setting the site reads
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/check-compose-settings.py

      - name: Restore
        run: dotnet restore MUIndex.slnx

      # Warnings are errors solution-wide (Directory.Build.props), so a clean build is the signal.
      - name: Build
        run: dotnet build MUIndex.slnx -c Release --no-restore

      # TUnit runs on Microsoft.Testing.Platform; execute each of the five test projects directly,
      # because the classic `dotnet test`/VSTest path is not available on .NET 10.
      # The Catalog and Crawler suites want a real PostgreSQL 17 through Testcontainers. On a laptop
      # with no container runtime they skip by name, which is honest — but a silently skipped storage
      # suite in CI is a green build that tested no storage, so the Linux leg (where a Docker daemon
      # is present) demands one and fails if it cannot get it.
      - name: Test — Catalog
        shell: bash
        env:
          MUI_REQUIRE_POSTGRES: ${{ matrix.os == 'ubuntu-latest' }}
        run: dotnet run -c Release --no-build --project tests/MUI.Catalog.Tests/MUI.Catalog.Tests.csproj

      - name: Test — Crawl
        shell: bash
        run: dotnet run -c Release --no-build --project tests/MUI.Crawl.Tests/MUI.Crawl.Tests.csproj

      - name: Test — Discovery
        shell: bash
        run: dotnet run -c Release --no-build --project tests/MUI.Discovery.Tests/MUI.Discovery.Tests.csproj

      # The I3 suite opens loopback sockets — a fake gateway answering on 127.0.0.1 — and nothing
      # else. No database, and nothing that leaves the machine: the Intermud-3 network is reached
      # only by the sidecar, which CI never starts.
      - name: Test — I3
        shell: bash
        run: dotnet run -c Release --no-build --project tests/MUI.I3.Tests/MUI.I3.Tests.csproj

      # The Crawler suite runs whole crawl cycles against a real PostgreSQL with the socket replaced,
      # so it wants a database for the same reason the Catalog suite does — and more so, because the
      # advisory lock that keeps N replicas to one crawler is a database behaviour with nothing about
      # it to fake.
      - name: Test — Crawler
        shell: bash
        env:
          MUI_REQUIRE_POSTGRES: ${{ matrix.os == 'ubuntu-latest' }}
        run: dotnet run -c Release --no-build --project tests/MUI.Crawler.Tests/MUI.Crawler.Tests.csproj

      # GET /health's database-backed cases want a real PostgreSQL too, for the same reason as
      # Catalog and Crawler above: a health check told about a mock's failure has not been tested
      # against what a real connection refusal looks like.
      - name: Test — Web
        shell: bash
        env:
          MUI_REQUIRE_POSTGRES: ${{ matrix.os == 'ubuntu-latest' }}
        run: dotnet run -c Release --no-build --project tests/MUI.Web.Tests/MUI.Web.Tests.csproj
