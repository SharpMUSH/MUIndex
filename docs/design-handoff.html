olid var(--border);border-radius:99px;padding:2px 7px\">unclaimed<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);vertical-align:top\">Claimed and enriched<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);color:var(--dim);vertical-align:top\">Visibly richer: an owner-written intro paragraph above the connect screen, the enrichment fields (application, RP enforcement, consent tooling, fandom) as their own block, and owner-sourced facts marked as such. The reward for claiming is <em>more page<\u002Fem>, never better ranking.<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 0;border-top:1px solid var(--hair);vertical-align:top\"><span style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-ring);background:var(--accent-tint);border-radius:99px;padding:2px 7px\">claimed<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);vertical-align:top\">Dark a week<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);color:var(--dim);vertical-align:top\">Page unchanged; a plate above the fold states the last successful probe and the cause. Presence panel shows the gap, not zeros.<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 0;border-top:1px solid var(--hair);vertical-align:top\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--warn)\">◇ unreachable 6d<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);vertical-align:top\">Dark a year / three years<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);color:var(--dim);vertical-align:top\">Archived treatment: one step dimmer, past tense, the run of years it was up given as a fact worth having. “We still try the door every week.”<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 0;border-top:1px solid var(--hair);vertical-align:top\"><span style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border:1px solid var(--border);border-radius:99px;padding:2px 7px\">archived<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);vertical-align:top\">Count unknown — WHO unparseable, no MSSP PLAYERS<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);color:var(--dim);vertical-align:top\">The count position reads “count unknown”, never 0 and never blank; a tooltip says which layer failed. Listing sorts these into their own band at the foot of “players now”, not at zero.<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 0;border-top:1px solid var(--hair);vertical-align:top\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--faint)\">– count unknown<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);vertical-align:top\">Connect screen suppressed<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);color:var(--dim);vertical-align:top\">Plain plate at hero height, owner's choice stated without editorial. Page leads with the name block instead; no layout hole.<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 0;border-top:1px solid var(--hair);vertical-align:top\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--faint)\">screen not republished<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr style=\"background:var(--warn-tint)\"><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);vertical-align:top\">Declared and measured conflict<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);color:var(--text);vertical-align:top\">Row sorted to the top of the matrix, tinted, counted in the section head, and expandable to the full sentence — including the charitable explanation, because most conflicts are staleness rather than deceit.<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 0;border-top:1px solid var(--hair);vertical-align:top\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--warn)\">✕ measured / ◇ declared<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);vertical-align:top\">Suspected duplicate<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);color:var(--dim);vertical-align:top\">Both pages stay live and reciprocally link: “this may be the same game as Ashen Court — awaiting review.” Never auto-hidden; a wrongly hidden game is worse than a duplicate.<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 0;border-top:1px solid var(--hair);vertical-align:top\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--faint)\">possible duplicate<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);vertical-align:top\">Almost no data — one endpoint and a name<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);color:var(--dim);vertical-align:top\">A deliberately short page, not a full template full of dashes. Name, endpoint, what we tried, what came back, when we will try again — and the claim invitation. Emptiness is presented as an accurate report, which is exactly what it is.<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 0;border-top:1px solid var(--hair);vertical-align:top\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--faint)\">1 fact known<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);vertical-align:top\">MSSP rotting since 2019<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 14px 11px 0;border-top:1px solid var(--hair);color:var(--dim);vertical-align:top\">Fields drop to the dim step with amber ages, and the block gains the standing note “six of these have not changed since 2019”. Measured facts beside them stay at full contrast — the visual hierarchy <em>is<\u002Fem> the precedence ladder.<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 0;border-top:1px solid var(--hair);vertical-align:top\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--warn)\">◇ 6y<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-a11y\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad) calc(var(--cpad)*2);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">07 — accessibility, motion, and what this changed<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--gap);margin-top:16px\">\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <h3 style=\"font-size:17px;font-weight:600\">Decisions, not intentions<\u002Fh3>\n      <ul style=\"margin-top:12px;padding-left:18px;color:var(--dim);font-size:13px;line-height:1.8\">\n        <li>WCAG 2.2 AA is the floor; the ANSI frame is the one region where source contrast is out of our hands, and it ships with the contrast-raise control for exactly that reason.<\u002Fli>\n        <li>Every state has a glyph as well as a colour: <span style=\"font-family:var(--mono);color:var(--text)\">● ✕ ◇ –<\u002Fspan>. Greyscale printing is a valid rendering.<\u002Fli>\n        <li>Heatmap and matrix are real tables with headers, arrow-key navigable, each with a one-sentence summary that is the first thing announced.<\u002Fli>\n        <li>Facet panel is a native form: fieldsets, legends, real checkboxes, querystring state, works with scripting off.<\u002Fli>\n        <li>Connect screens are figures with a text alternative and a skip link; SGR codes are never read aloud.<\u002Fli>\n        <li>Plain mode at <span style=\"font-family:var(--mono)\">?plain=1<\u002Fspan>, served automatically to text browsers, and used internally as the test of whether a fact is really being communicated.<\u002Fli>\n        <li>200% zoom: every layout here is a single column below 900px; no horizontal scroll except inside the ANSI frame, where it is correct.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <h3 style=\"font-size:17px;font-weight:600\">Motion budget<\u002Fh3>\n      <p style=\"color:var(--dim);font-size:13px;line-height:1.7;margin-top:10px\">Three places, total. A live player count cross-fades over 150ms when it changes. A “came back” card glows once on arrival, 1.4s, never repeating. Disclosures open at 120ms. Everything else is instant. Under <span style=\"font-family:var(--mono)\">prefers-reduced-motion<\u002Fspan> all three become plain state changes — and the live count switches to a manual “refresh” affordance rather than updating under the reader.<\u002Fp>\n      <h3 style=\"font-size:17px;font-weight:600;margin-top:20px\">Density<\u002Fh3>\n      <p style=\"color:var(--dim);font-size:13px;line-height:1.7;margin-top:10px\">Comfortable is the default and compact is worth its complexity here, because the listing and the capability matrix are genuinely tabular. It is one control in the footer writing one preference, changing <span style=\"font-family:var(--mono)\">--cpad<\u002Fspan> and row padding only — never font size, never which facts are shown. Try it in the header.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--accent-ring);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <h3 style=\"font-size:17px;font-weight:600\">Where the design pushes back on the system spec<\u002Fh3>\n      <ul style=\"margin-top:12px;padding-left:18px;color:var(--dim);font-size:13px;line-height:1.8\">\n        <li><span style=\"color:var(--text)\">Presence needs a per-hour “probed but no sample” marker.<\u002Fspan> §5.4 gives a gap when a probe fails, but a probe that succeeds while WHO is unparseable also writes nothing — and that renders identically to unreachable. The heatmap needs three states, so the store needs to distinguish them.<\u002Fli>\n        <li><span style=\"color:var(--text)\">Per-field expected-refresh windows are a display requirement.<\u002Fspan> The chip flips to amber on age, and “old” differs by field — hours for presence, a year for hand-typed prose. That TTL belongs in the field registry, not in the front end.<\u002Fli>\n        <li><span style=\"color:var(--text)\">“Uptime” should be called reachable everywhere<\u002Fspan>, including in the API, so the wording cannot drift back.<\u002Fli>\n        <li><span style=\"color:var(--text)\">The ecosystem dashboard's headline population figure should not ship.<\u002Fspan> Per §15.6 — publish per-codebase and per-protocol shares, which are ratios over the same measured set and survive the unclaimed/unreachable bias; withhold the absolute “how many people play MU*” number until there is a defensible method.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:22px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--faint)\">\n    <span>designed below:<\u002Fspan><span style=\"color:var(--dim)\">claim flow<\u002Fspan><span>·<\u002Fspan><span style=\"color:var(--dim)\">owner dashboard &amp; linter<\u002Fspan><span>·<\u002Fspan><span style=\"color:var(--dim)\">ecosystem dashboard<\u002Fspan><span>·<\u002Fspan><span style=\"color:var(--dim)\">crawler transparency<\u002Fspan><span>·<\u002Fspan><span style=\"color:var(--dim)\">reference pages<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-claim\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">08 — claim flow<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">Prove it through the game, not through us<\u002Fh2>\n  <p style=\"max-width:74ch;margin-top:12px;color:var(--dim);font-size:14px;line-height:1.7;text-wrap:pretty\">Three steps, one screen each, and the third is a wait. The whole flow leans on a fact worth stating plainly to the owner: <span style=\"color:var(--text)\">we already connect to your game every hour<\u002Fspan>, so proving control costs one line of config and no email round-trip. Copy is written for a volunteer who last touched their MSSP block in 2019.<\u002Fp>\n\n  <div style=\"margin-top:18px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg)\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface-3);border-bottom:1px solid var(--hair)\">\n      <span style=\"font-family:var(--mono);font-size:13px\">mu<span style=\"color:var(--accent)\">*<\u002Fspan>index<\u002Fspan>\n      <span style=\"font-family:var(--mono);font-size:11.5px;color:var(--faint)\">/g/tidewater-nights/claim<\u002Fspan>\n      <span style=\"margin-left:auto;display:flex;gap:16px;font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase\">\n        <span style=\"color:var(--accent)\">1 · token<\u002Fspan><span style=\"color:var(--text)\">2 · publish it<\u002Fspan><span style=\"color:var(--faint)\">3 · we check<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:24px\">\n      <h3 style=\"font-size:20px;font-weight:600\">Publish this token somewhere only the game's operator can reach.<\u002Fh3>\n      <div style=\"margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n        <div style=\"font-family:var(--mono);font-size:15px;background:var(--surface-2);border:1px solid var(--accent-ring);border-radius:var(--radius);padding:11px 15px;letter-spacing:.04em\">muidx-7f3a-c19e-4b02<\u002Fdiv>\n        <span style=\"font-size:12.5px;color:var(--dim)\">copy<\u002Fspan>\n        <span style=\"font-family:var(--mono);font-size:11.5px;color:var(--faint)\">valid 14 days · one game · regenerate any time<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:20px\">\n        <div style=\"border:1px solid var(--accent-ring);background:var(--accent-tint);border-radius:var(--radius);padding:16px\">\n          <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-size:15px;font-weight:600\">MSSP field<\u002Fspan><span style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)\">easiest<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;background:var(--surface-3);border:1px solid var(--hair);border-radius:6px;padding:10px;margin-top:10px;color:var(--dim);white-space:pre-wrap\">mssp CONTACT_TOKEN/muidx-7f3a-c19e-4b02<\u002Fdiv>\n          <p style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:10px\">PennMUSH: add the line to <span style=\"font-family:var(--mono)\">mushcnf.dst<\u002Fspan> and <span style=\"font-family:var(--mono)\">@restart<\u002Fspan>. Evennia and TinyMUX equivalents are shown when we know your codebase — we already measured it.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--hair);background:var(--surface);border-radius:var(--radius);padding:16px\">\n          <div style=\"font-size:15px;font-weight:600\">A line on the connect screen<\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;background:var(--surface-3);border:1px solid var(--hair);border-radius:6px;padding:10px;margin-top:10px;color:var(--dim);white-space:pre-wrap\">muidx-7f3a-c19e-4b02<\u002Fdiv>\n          <p style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:10px\">Anywhere in the banner, including the bottom where players will not notice. Remove it as soon as we confirm — we will tell you when.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--hair);background:var(--surface);border-radius:var(--radius);padding:16px\">\n          <div style=\"font-size:15px;font-weight:600\">DNS TXT record<\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;background:var(--surface-3);border:1px solid var(--hair);border-radius:6px;padding:10px;margin-top:10px;color:var(--dim);white-space:pre-wrap\">_muindex.tidewater.example\nTXT \"muidx-7f3a-c19e-4b02\"<\u002Fdiv>\n          <p style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:10px\">For operators who do not run the game daemon themselves. Slowest to propagate; we re-check hourly for 14 days.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n        <div style=\"border:1px solid var(--hair);border-radius:var(--radius);padding:14px;background:var(--surface-3)\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">waiting state<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-top:10px\"><span style=\"font-family:var(--mono);color:var(--accent);animation:muPulse 1.4s ease-in-out infinite\">●<\u002Fspan><span style=\"font-size:14px\">Watching for the token. Next probe in <span style=\"font-family:var(--mono)\">41 minutes<\u002Fspan>.<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:8px\">You can close this page. We check on the schedule your game already sets with <span style=\"font-family:var(--mono)\">CRAWL DELAY<\u002Fspan> — we will not hammer your port to be helpful.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--hair);border-radius:var(--radius);padding:14px;background:var(--surface-3)\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">not found yet — after 3 probes<\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.65;margin-top:8px;color:var(--text)\">We connected three times and did not see the token. Here is what we <em>did<\u002Fem> see in your MSSP: <span style=\"font-family:var(--mono);font-size:12px;color:var(--dim)\">CONTACT, NAME, PORT, CODEBASE, FAMILY<\u002Fspan>.<\u002Fp>\n          <p style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:8px\">A diagnostic, never a failure. The likeliest cause is that the game has not restarted since you edited the config; the second is a typo, so we show you the raw field list to compare against.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:18px;line-height:1.6\">the token stays valid after verification and doubles as the identity beacon (§7.3) — a claimed game is never duplicated, never lost on a host move. That is the argument we make to owners, in those words, on the success screen.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-owner\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">09 — owner dashboard<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">A different user, so a different room<\u002Fh2>\n  <p style=\"max-width:74ch;margin-top:12px;color:var(--dim);font-size:14px;line-height:1.7;text-wrap:pretty\">The public site is a reference work read by strangers; this is a tool used by one tired volunteer at 1am. It gets a sidebar, wider controls, saved-state feedback in words, and no provenance chips — everything here is either theirs or ours, and we say which in plain sentences instead.<\u002Fp>\n\n  <div style=\"margin-top:18px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg)\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface-3);border-bottom:1px solid var(--hair)\">\n      <span style=\"font-family:var(--mono);font-size:13px\">mu<span style=\"color:var(--accent)\">*<\u002Fspan>index<\u002Fspan>\n      <span style=\"font-size:13px;color:var(--dim)\">Tidewater Nights<\u002Fspan>\n      <span style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-ring);background:var(--accent-tint);border-radius:99px;padding:2px 7px\">claimed · you are an owner<\u002Fspan>\n      <span style=\"margin-left:auto;font-size:12.5px;color:var(--dim)\">view public page →<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:196px minmax(0,1fr)\">\n      <div style=\"border-right:1px solid var(--hair);background:var(--surface-3);padding:16px 12px\">\n        <div style=\"display:grid;gap:3px;font-size:13px\">\n          <span style=\"padding:8px 10px;border-radius:var(--radius);background:var(--surface-2);color:var(--text)\">overview<\u002Fspan>\n          <span style=\"padding:8px 10px;color:var(--dim)\">listing details<\u002Fspan>\n          <span style=\"padding:8px 10px;color:var(--dim)\">connect screen<\u002Fspan>\n          <span style=\"padding:8px 10px;color:var(--dim)\">player counts<\u002Fspan>\n          <span style=\"padding:8px 10px;color:var(--dim)\">badges &amp; embeds<\u002Fspan>\n          <span style=\"padding:8px 10px;color:var(--dim)\">owners &amp; transfer<\u002Fspan>\n          <span style=\"padding:8px 10px;color:var(--dim)\">opt out<\u002Fspan>\n          <span style=\"padding:8px 10px;color:var(--dim)\">audit log<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;padding:11px;border:1px solid var(--hair);border-radius:var(--radius);font-size:11.5px;color:var(--faint);line-height:1.6\">Nothing here changes your ranking. Rankings are computed from measurement only — we cannot boost you and neither can anyone else.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:20px 22px 24px;min-width:0\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n          <div style=\"border:1px solid var(--hair);border-radius:var(--radius);padding:13px;background:var(--surface)\"><div style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)\">on now<\u002Fdiv><div style=\"font-family:var(--mono);font-size:20px;color:var(--accent);margin-top:5px\">14<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--hair);border-radius:var(--radius);padding:13px;background:var(--surface)\"><div style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)\">reachable 90d<\u002Fdiv><div style=\"font-family:var(--mono);font-size:20px;margin-top:5px\">95.6%<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--hair);border-radius:var(--radius);padding:13px;background:var(--surface)\"><div style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)\">page views 30d<\u002Fdiv><div style=\"font-family:var(--mono);font-size:20px;margin-top:5px\">1,840<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--hair);border-radius:var(--radius);padding:13px;background:var(--surface)\"><div style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)\">last probe<\u002Fdiv><div style=\"font-family:var(--mono);font-size:20px;margin-top:5px\">4m<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:20px;border:1px solid var(--hair);border-radius:var(--radius-lg);background:var(--surface);padding:18px\">\n          <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n            <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">mssp scorecard<\u002Fdiv>\n            <span style=\"font-family:var(--mono);font-size:12px;color:var(--dim)\">continuous · re-read every probe<\u002Fspan>\n          <\u002Fdiv>\n          <h4 style=\"font-size:19px;font-weight:600;margin-top:10px\">You have 12 of the 26 MSSP fields set, and the nine that matter most are all there.<\u002Fh4>\n          <p style=\"font-size:13px;color:var(--dim);line-height:1.65;margin-top:8px;max-width:70ch\">Three things below would change what players see on your page. Everything else is optional and we will stop mentioning it.<\u002Fp>\n          <div style=\"display:grid;gap:10px;margin-top:16px\">\n            <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--warn);background:var(--warn-tint);border-radius:var(--radius)\">\n              <span style=\"font-family:var(--mono);color:var(--warn)\">◇<\u002Fspan>\n              <div>\n                <div style=\"font-size:14px\">Your <span style=\"font-family:var(--mono)\">GMCP<\u002Fspan> field says <span style=\"font-family:var(--mono)\">1<\u002Fspan>, but your server has never offered GMCP in 214 handshakes.<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:5px\">Your page currently shows this as a disagreement, which looks worse than it is. Either set it to <span style=\"font-family:var(--mono)\">0<\u002Fspan>, or enable GMCP — PennMUSH 1.8.8 supports it and you are already running it.<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--dim);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap\"><span style=\"border-bottom:1px dotted var(--border);cursor:pointer\">show me the config line<\u002Fspan><span style=\"border-bottom:1px dotted var(--border);cursor:pointer\">it is correct, mark as reviewed<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--surface-3)\">\n              <span style=\"font-family:var(--mono);color:var(--dim)\">·<\u002Fspan>\n              <div>\n                <div style=\"font-size:14px\">Nothing has changed in <span style=\"font-family:var(--mono)\">DESCRIPTION<\u002Fspan> since 2019.<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:5px\">Not a problem — plenty of games are stable. We mark it as old on your page because we cannot tell the difference between stable and forgotten. Editing it, or confirming it here, clears the mark for a year.<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--dim);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap\"><span style=\"border-bottom:1px dotted var(--accent-ring);color:var(--text);cursor:pointer\">still accurate — confirm<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--surface-3)\">\n              <span style=\"font-family:var(--mono);color:var(--dim)\">·<\u002Fspan>\n              <div>\n                <div style=\"font-size:14px\"><span style=\"font-family:var(--mono)\">LANGUAGE<\u002Fspan> is set to <span style=\"font-family:var(--mono)\">english<\u002Fspan>; the standard value is <span style=\"font-family:var(--mono)\">English<\u002Fspan>.<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:5px\">We already normalise it, so nothing is broken. Worth fixing only if you care what other crawlers see.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--accent-ring);background:var(--accent-tint);border-radius:var(--radius)\">\n              <span style=\"font-family:var(--mono);color:var(--accent)\">●<\u002Fspan>\n              <div>\n                <div style=\"font-size:14px\">You added TLS on port 4202 in March, and we picked it up the same hour.<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:5px\">96 of 1,213 games offer TLS. Your page says so, measured.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:14px;line-height:1.6\">no score out of ten, no letter grade, no progress ring. A grade turns a volunteer's hobby into homework, and the fields that are missing are mostly ones no player reads. Findings are ordered by <span style=\"color:var(--dim)\">what changes the public page<\u002Fspan>, each with the exact edit and the reason a player would care.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px\">\n          <div style=\"border:1px solid var(--hair);border-radius:var(--radius);background:var(--surface);padding:16px\">\n            <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">enrichment — what MSSP cannot say<\u002Fdiv>\n            <div style=\"display:grid;gap:11px;margin-top:12px;font-size:13px\">\n              <label style=\"display:grid;gap:5px\"><span style=\"color:var(--dim)\">fandom or setting IP<\u002Fspan><span style=\"font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px\">original setting<\u002Fspan><\u002Flabel>\n              <label style=\"display:grid;gap:5px\"><span style=\"color:var(--dim)\">RP enforcement<\u002Fspan><span style=\"font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px\">enforced in public scenes ▾<\u002Fspan><\u002Flabel>\n              <label style=\"display:grid;gap:5px\"><span style=\"color:var(--dim)\">how to get a character<\u002Fspan><span style=\"font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px\">application, usually 48h ▾<\u002Fspan><\u002Flabel>\n              <label style=\"display:grid;gap:5px\"><span style=\"color:var(--dim)\">consent &amp; content tools<\u002Fspan><span style=\"font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px\">+consent, content flags, fade-to-black<\u002Fspan><\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:11px;line-height:1.55\">saved as you type · your page updates within a minute · shown as “from the owner”<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--hair);border-radius:var(--radius);background:var(--surface);padding:16px\">\n            <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">what we publish about you<\u002Fdiv>\n            <div style=\"display:grid;gap:12px;margin-top:12px;font-size:13px\">\n              <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"font-family:var(--mono);color:var(--accent)\">[on]<\u002Fspan><div><div>Connect screen<\u002Fdiv><div style=\"font-size:12px;color:var(--faint);line-height:1.55\">Turn this off and we stop republishing it, no questions and no note on your page beyond “not republished”.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"font-family:var(--mono);color:var(--accent)\">[on]<\u002Fspan><div><div>Player counts from WHO<\u002Fdiv><div style=\"font-size:12px;color:var(--faint);line-height:1.55\">Or override the format, or tell us to use MSSP <span style=\"font-family:var(--mono)\">PLAYERS<\u002Fspan> instead. Names are never stored either way.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"font-family:var(--mono);color:var(--dim)\">[off]<\u002Fspan><div><div>Opt out entirely<\u002Fdiv><div style=\"font-size:12px;color:var(--faint);line-height:1.55\">Honoured within one crawl cycle. The page becomes a stub with the name and the date you opted out — the URL keeps working, because other sites link to it.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--hair);border-radius:var(--radius);background:var(--surface);padding:16px\">\n            <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">badge &amp; embed<\u002Fdiv>\n            <div style=\"margin-top:12px;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:7px 10px\"><span style=\"color:var(--accent)\">●<\u002Fspan>14 playing now<span style=\"color:var(--faint)\">· muindex<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:var(--mono);font-size:11px;background:var(--surface-3);border:1px solid var(--hair);border-radius:6px;padding:10px;margin-top:10px;color:var(--dim);white-space:pre-wrap\">&lt;img src=\"…/g/tidewater-nights/badge.svg\"&gt;<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:10px\">Live SVG for your own site, plus a JSON endpoint. The badge shows a count or the word “unknown” — it never shows zero unless we measured zero.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:18px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--surface-3);padding:14px 16px\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">audit log · owners &amp; transfer<\u002Fdiv>\n          <div style=\"display:grid;gap:7px;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--dim)\">\n            <div><span style=\"color:var(--faint)\">2026-07-14 09:02<\u002Fspan> · rowan@ · edited SUBGENRE<\u002Fdiv>\n            <div><span style=\"color:var(--faint)\">2026-03-02 22:40<\u002Fspan> · system · TLS observed, no owner action<\u002Fdiv>\n            <div><span style=\"color:var(--faint)\">2025-11-02 18:41<\u002Fspan> · rowan@ · claimed via MSSP token<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:10px\">Two owners, both listed publicly as “claimed by the game's staff” and never by name. Transfer needs a fresh token published through the game — the same proof as the first claim, because staff turnover is the normal case, not an exception.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-ecosystem\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">10 — ecosystem dashboard<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">Ratios we can defend, and one number we will not publish<\u002Fh2>\n  <p style=\"max-width:76ch;margin-top:12px;color:var(--dim);font-size:14px;line-height:1.7;text-wrap:pretty\">This is the page nobody else can write, so it has to be the most careful one on the site. Every chart states its denominator in the subtitle, in words, before the graphic. Where the honest answer is “we cannot know that”, the panel says so at the same size as a chart rather than hiding the gap.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:var(--gap);margin-top:20px\">\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">protocol adoption<\u002Fdiv>\n      <h3 style=\"font-size:17px;font-weight:600;margin-top:7px\">Share of reachable games offering each protocol, measured in the handshake<\u002Fh3>\n      <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:5px\">denominator: the 310 games reachable in the last 7 days · declared support is excluded entirely<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;align-items:stretch;margin-top:14px\">\n        <div style=\"display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);padding:2px 0 18px\">\n          <span>60%<\u002Fspan><span>0<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <svg sc-camel-view-box=\"20 15 484 160\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:150px;display:block\" role=\"img\" aria-label=\"Protocol adoption 2019 to 2026: UTF-8 rises from 30 to 54 percent, GMCP from 18 to 35, TLS from 8 to 31\">\n            <line x1=\"20\" y1=\"170\" x2=\"500\" y2=\"170\" stroke=\"var(--border)\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n            <polyline points=\"{{ utfLine }}\" fill=\"none\" stroke=\"var(--info)\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpolyline>\n            <polyline points=\"{{ gmcpLine }}\" fill=\"none\" stroke=\"var(--warn)\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpolyline>\n            <polyline points=\"{{ tlsLine }}\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\u002Fpolyline>\n          <\u002Fsvg>\n          <div style=\"display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:5px\"><span>2019<\u002Fspan><span>2026<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:11.5px\">\n        <span style=\"color:var(--info)\">— utf-8 54%<\u002Fspan><span style=\"color:var(--warn)\">— gmcp 35%<\u002Fspan><span style=\"color:var(--accent)\">— tls 31%<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:12px\">TLS is the story: 8% to 31% in seven years, and the curve steepens after 2022. Below the chart the page carries the same series as a plain table, because a trend nobody can read in text is a trend we have not communicated.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">codebase share<\u002Fdiv>\n      <h3 style=\"font-size:17px;font-weight:600;margin-top:7px\">What the reachable games are running<\u002Fh3>\n      <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:5px\">codebase identified from the banner where MSSP is absent or wrong · 41 games unidentified and shown as such<\u002Fdiv>\n      <div style=\"display:grid;gap:9px;margin-top:16px;font-size:13px\">\n        <div><div style=\"display:flex;justify-content:space-between\"><span>PennMUSH<\u002Fspan><span style=\"font-family:var(--mono);color:var(--dim)\">212<\u002Fspan><\u002Fdiv><div style=\"height:9px;border-radius:3px;background:var(--surface-2);margin-top:5px\"><div style=\"width:68%;height:9px;border-radius:3px;background:color-mix(in oklab,var(--accent) 70%,var(--surface-2))\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div><div style=\"display:flex;justify-content:space-between\"><span>Evennia<\u002Fspan><span style=\"font-family:var(--mono);color:var(--dim)\">96<\u002Fspan><\u002Fdiv><div style=\"height:9px;border-radius:3px;background:var(--surface-2);margin-top:5px\"><div style=\"width:31%;height:9px;border-radius:3px;background:color-mix(in oklab,var(--accent) 58%,var(--surface-2))\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div><div style=\"display:flex;justify-content:space-between\"><span>TinyMUX<\u002Fspan><span style=\"font-family:var(--mono);color:var(--dim)\">61<\u002Fspan><\u002Fdiv><div style=\"height:9px;border-radius:3px;background:var(--surface-2);margin-top:5px\"><div style=\"width:20%;height:9px;border-radius:3px;background:color-mix(in oklab,var(--accent) 50%,var(--surface-2))\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div><div style=\"display:flex;justify-content:space-between\"><span>RhostMUSH<\u002Fspan><span style=\"font-family:var(--mono);color:var(--dim)\">28<\u002Fspan><\u002Fdiv><div style=\"height:9px;border-radius:3px;background:var(--surface-2);margin-top:5px\"><div style=\"width:9%;height:9px;border-radius:3px;background:color-mix(in oklab,var(--accent) 42%,var(--surface-2))\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div><div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--dim)\">TinyMUSH 3.x<\u002Fspan><span style=\"font-family:var(--mono);color:var(--dim)\">17<\u002Fspan><\u002Fdiv><div style=\"height:9px;border-radius:3px;background:var(--surface-2);margin-top:5px\"><div style=\"width:5.5%;height:9px;border-radius:3px;background:color-mix(in oklab,var(--accent) 38%,var(--surface-2))\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div><div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--faint)\">unidentified<\u002Fspan><span style=\"font-family:var(--mono);color:var(--faint)\">41<\u002Fspan><\u002Fdiv><div style=\"height:9px;border-radius:3px;background:var(--surface-2);margin-top:5px\"><div style=\"width:13%;height:9px;border-radius:3px;background-image:repeating-linear-gradient(45deg,var(--border) 0 1px,transparent 1px 4px);border:1px solid var(--hair)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:14px\">Unidentified is a bar, not a footnote. Two of the five named codebases — RhostMUSH and TinyMUSH 3.x — have no MSSP implementation at all, so their counts come entirely from banner fingerprints; the page says that under the chart rather than in a tooltip.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--gap);margin-top:var(--gap)\">\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">the hobby, over time<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:16px\">\n        <div style=\"flex:1;height:38%;background:color-mix(in oklab,var(--accent) 45%,var(--surface-2));border-radius:2px\"><\u002Fdiv>\n        <div style=\"flex:1;height:44%;background:color-mix(in oklab,var(--accent) 45%,var(--surface-2));border-radius:2px\"><\u002Fdiv>\n        <div style=\"flex:1;height:52%;background:color-mix(in oklab,var(--accent) 45%,var(--surface-2));border-radius:2px\"><\u002Fdiv>\n        <div style=\"flex:1;height:61%;background:color-mix(in oklab,var(--accent) 50%,var(--surface-2));border-radius:2px\"><\u002Fdiv>\n        <div style=\"flex:1;height:66%;background:color-mix(in oklab,var(--accent) 55%,var(--surface-2));border-radius:2px\"><\u002Fdiv>\n        <div style=\"flex:1;height:78%;background:color-mix(in oklab,var(--accent) 62%,var(--surface-2));border-radius:2px\"><\u002Fdiv>\n        <div style=\"flex:1;height:88%;background:color-mix(in oklab,var(--accent) 70%,var(--surface-2));border-radius:2px\"><\u002Fdiv>\n        <div style=\"flex:1;height:100%;background:color-mix(in oklab,var(--accent) 78%,var(--surface-2));border-radius:2px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:8px\">games we could reach, by quarter · rising because our coverage is rising<\u002Fdiv>\n      <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:12px\">Labelled as a measure of <em>us<\u002Fem>, not of the hobby. Until the discovery graph stops finding new games at this rate, this line says more about the crawler than about how many MUSHes exist.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--warn);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--warn)\">withheld<\u002Fdiv>\n      <h3 style=\"font-size:17px;font-weight:600;margin-top:7px\">“How many people play MU*?”<\u002Fh3>\n      <p style=\"font-size:13px;color:var(--dim);line-height:1.7;margin-top:10px\">We are not publishing a headline population number, and this panel explains why in the place a reader would look for one. Unreachable is not zero; unclaimed games under-report; a player logged into three games is three counts. We publish the parts we can defend — concurrent players across reachable games, with its own denominator — and refuse the single figure a journalist would want.<\u002Fp>\n      <div style=\"margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.8\"><span style=\"color:var(--text)\">1,284<\u002Fspan> concurrent players, all reachable games, right now<br><span style=\"color:var(--text)\">4,110<\u002Fspan> peak concurrent, past 90 days<\u002Fdiv>\n      <p style=\"font-size:12px;color:var(--faint);line-height:1.6;margin-top:12px\">Refusing to publish a number, visibly, is itself the strongest evidence that the numbers we do publish were checked.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">liveness, aggregated<\u002Fdiv>\n      <div style=\"display:grid;gap:12px;margin-top:14px;font-size:13.5px\">\n        <div style=\"display:flex;justify-content:space-between\"><span>found this month<\u002Fspan><span style=\"font-family:var(--mono);color:var(--accent)\">+23<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span>went dark this month<\u002Fspan><span style=\"font-family:var(--mono);color:var(--dim)\">−9<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span>came back this month<\u002Fspan><span style=\"font-family:var(--mono);color:var(--accent)\">+4<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;border-top:1px solid var(--hair);padding-top:12px\"><span style=\"color:var(--dim)\">median age of a reachable game<\u002Fspan><span style=\"font-family:var(--mono)\">14 years<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--dim)\">longest continuous uptime<\u002Fspan><span style=\"font-family:var(--mono)\">4y 2m<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:14px\">The three feed types roll up here as a monthly balance. It is the closest thing to a health indicator we can honestly offer, and it is arithmetic over intervals rather than a model.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-crawler\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">11 — crawler transparency<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">A trust artifact, designed as one<\u002Fh2>\n  <p style=\"max-width:76ch;margin-top:12px;color:var(--dim);font-size:14px;line-height:1.7;text-wrap:pretty\">An admin finds this page after seeing us in their logs, and arrives mildly annoyed. So it opens with what they actually want — who we are, what we sent, and how to make us stop — before anything about the project. No marketing above the fold; the opt-out is not at the bottom.<\u002Fp>\n\n  <div style=\"margin-top:18px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg)\">\n    <div style=\"padding:24px;border-bottom:1px solid var(--hair)\">\n      <h3 style=\"font-size:22px;font-weight:600\">You saw us in your logs. Here is exactly what we did.<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px\">\n        <div style=\"border:1px solid var(--hair);border-radius:var(--radius);background:var(--surface-3);padding:14px\">\n          <div style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)\">how to identify us<\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.8\">TTYPE / MTTS <span style=\"color:var(--text)\">muindex-crawler<\u002Fspan><br>MNES CLIENT_NAME <span style=\"color:var(--text)\">muindex<\u002Fspan><br>source <span style=\"color:var(--text)\">198.51.100.24<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--hair);border-radius:var(--radius);background:var(--surface-3);padding:14px\">\n          <div style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)\">what one visit costs you<\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.8\">one TCP connection<br>under 4 seconds, hard timeout<br><span style=\"color:var(--text)\">WHO<\u002Fspan> and <span style=\"color:var(--text)\">MSSP-REQUEST<\u002Fspan>, then quit<br>never logs in, never creates<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--accent-ring);background:var(--accent-tint);border-radius:var(--radius);padding:14px\">\n          <div style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)\">make us stop<\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.8\">MSSP <span style=\"color:var(--text)\">CRAWL_OPT_OUT 1<\u002Fspan><br>or DNS TXT <span style=\"color:var(--text)\">_muindex … \"optout\"<\u002Fspan><br>or email us<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--dim);margin-top:9px;line-height:1.55\">Honoured within one cycle, no reply required, no reason asked.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0\">\n      <div style=\"padding:20px 24px;border-right:1px solid var(--hair)\">\n        <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">how often we knock<\u002Fdiv>\n        <sc-raw-table style=\"width:100%;margin-top:12px;font-size:13px\">\n          <sc-raw-tbody style=\"font-family:var(--mono);font-size:12px\">\n            <sc-raw-tr><sc-raw-td style=\"padding:8px 0;color:var(--dim)\">your CRAWL DELAY<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0;text-align:right;color:var(--accent)\">always the floor<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:8px 0;border-top:1px solid var(--hair);color:var(--dim)\">active game<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0;border-top:1px solid var(--hair);text-align:right\">hourly<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:8px 0;border-top:1px solid var(--hair);color:var(--dim)\">quiet 30 days<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0;border-top:1px solid var(--hair);text-align:right\">every 6 hours<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:8px 0;border-top:1px solid var(--hair);color:var(--dim)\">dark 1 year<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0;border-top:1px solid var(--hair);text-align:right\">daily<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:8px 0;border-top:1px solid var(--hair);color:var(--dim)\">dark 3 years<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0;border-top:1px solid var(--hair);text-align:right\">weekly, forever<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:12px\">The floor is the point. Every incumbent lost games by giving up on them; a weekly knock forever is what lets a return be noticed the same day.<\u002Fp>\n        <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:20px\">what we keep<\u002Fdiv>\n        <div style=\"display:grid;gap:8px;margin-top:10px;font-size:13px\">\n          <div style=\"display:flex;gap:10px\"><span style=\"font-family:var(--mono);color:var(--accent)\">●<\u002Fspan><span>Counts, capabilities, banners, timings — indefinitely.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"font-family:var(--mono);color:var(--warn)\">◇<\u002Fspan><span>Raw probe payloads, names redacted before they touch disk — 14 days, so parser fixes can be replayed.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"font-family:var(--mono);color:var(--dim)\">✕<\u002Fspan><span style=\"color:var(--dim)\">Player names. Never written down. WHO is parsed in memory; aggregates use a salt that rotates, so nobody can be followed across epochs — including us.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:20px 24px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">how we found each other · referral graph<\u002Fdiv>\n          <span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">10 of 1,213 shown<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;width:100%;margin-top:10px;padding:0 4px\">\n          <svg sc-camel-view-box=\"0 0 520 300\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"Referral graph: Ashen Court refers to four games including Corvid Falls and Salt and Cinder; ten games shown, three of them dark\">\n            <sc-for list=\"{{ graphEdges }}\" as=\"e\" hint-placeholder-count=\"10\">\n              <line x1=\"{{ e.x1 }}\" y1=\"{{ e.y1 }}\" x2=\"{{ e.x2 }}\" y2=\"{{ e.y2 }}\" stroke=\"{{ e.stroke }}\" stroke-width=\"1\"><\u002Fline>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ graphNodes }}\" as=\"n\" hint-placeholder-count=\"10\">\n              <circle cx=\"{{ n.x }}\" cy=\"{{ n.y }}\" r=\"{{ n.rad }}\" fill=\"{{ n.fill }}\" stroke=\"{{ n.stroke }}\" stroke-dasharray=\"{{ n.dash }}\" stroke-width=\"1\"><\u002Fcircle>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n          <sc-for list=\"{{ graphNodes }}\" as=\"n\" hint-placeholder-count=\"10\">\n            <div style=\"{{ n.labelStyle }}\">{{ n.id }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px\">\n          <span><span style=\"color:var(--accent)\">●<\u002Fspan> found this week<\u002Fspan>\n          <span><span style=\"color:var(--dim)\">●<\u002Fspan> reachable<\u002Fspan>\n          <span><span style=\"color:var(--faint)\">◌<\u002Fspan> dark, still probed<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:12px\">The graph is provenance made visible: every edge is a <span style=\"font-family:var(--mono)\">REFERRAL<\u002Fspan> one game published about another, and hovering an edge says when we first and last saw it. It earns its place on this page rather than the dashboard because it answers the admin's real question — <em>how did you get my address?<\u002Fem> — with a picture and a name.<\u002Fp>\n        <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:10px\">Non-visual equivalent is a sentence and a list, not the SVG: “Ashen Court refers to 4 games; 3 of those refer onward to 5 more; 3 of the 10 are currently dark.” Under <span style=\"font-family:var(--mono)\">prefers-reduced-motion<\u002Fspan> the layout is static — there is no simulation, the positions are computed once server-side so the same game is always in the same place.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-reference\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad) calc(var(--cpad)*2);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">12 — reference pages<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">Hand-written prose, machine-written numbers, visibly separated<\u002Fh2>\n  <p style=\"max-width:76ch;margin-top:12px;color:var(--dim);font-size:14px;line-height:1.7;text-wrap:pretty\">Clients, codebases and protocols share one template. Prose is single-author, versioned in git, and carries a byline and a date — it is the one place on the site where a human is asserting rather than a machine measuring, and it says so. Everything in a bordered panel beside it is crawl-derived and dated. That split is the whole design: <span style=\"color:var(--text)\">a wiki's value without a wiki's governance<\u002Fspan>.<\u002Fp>\n\n  <div style=\"margin-top:18px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg)\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface-3);border-bottom:1px solid var(--hair)\">\n      <span style=\"font-family:var(--mono);font-size:13px\">mu<span style=\"color:var(--accent)\">*<\u002Fspan>index<\u002Fspan>\n      <span style=\"font-family:var(--mono);font-size:11.5px;color:var(--faint)\">/code/pennmush<\u002Fspan>\n      <span style=\"margin-left:auto;font-size:12.5px;color:var(--dim)\">clients · codebases · protocols<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:0\">\n      <div style=\"padding:24px;border-right:1px solid var(--hair)\">\n        <h3 style=\"font-size:28px;font-weight:600;letter-spacing:-.015em\">PennMUSH<\u002Fh3>\n        <div style=\"font-size:16px;color:var(--dim);margin-top:6px\">The most-used MUSH server, and the one most others aim to be compatible with.<\u002Fdiv>\n        <p style=\"font-size:14.5px;line-height:1.75;margin-top:16px;max-width:64ch;text-wrap:pretty\">If you are starting a new MUSH today and have no strong opinion, this is the default answer. It has been maintained continuously since 1992, its softcode is the dialect most builders already know, and it auto-fills nine MSSP fields — which is why PennMUSH games are the best-described listings on this site without their owners doing anything.<\u002Fp>\n        <p style=\"font-size:14.5px;line-height:1.75;margin-top:12px;max-width:64ch;text-wrap:pretty\">Choose something else if you want Python rather than softcode as your extension language, in which case read the Evennia page.<\u002Fp>\n        <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--faint);border-top:1px solid var(--hair);padding-top:12px\">\n          <span style=\"color:var(--dim)\">written by the editors<\u002Fspan><span>·<\u002Fspan><span>last revised 2026-05-11<\u002Fspan><span>·<\u002Fspan><span style=\"color:var(--dim)\">history<\u002Fspan><span>·<\u002Fspan><span style=\"color:var(--dim)\">suggest a correction<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:24px\">orientation<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.7;color:var(--dim);margin-top:8px;max-width:64ch\">New here? <a href=\"#s-reference\">MUSH, MUD, MUCK and MOO<\u002Fa> explains the families in about four hundred words, then hands you to <a href=\"#s-reference\">“I want collaborative roleplay”<\u002Fa>, which walks codebase → client → a filtered list of games. Curated, single-author, and the only editorial voice on the site.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:24px;display:grid;gap:18px;align-content:start\">\n        <div style=\"border:1px solid var(--accent-ring);border-radius:var(--radius);padding:14px;background:var(--accent-tint)\">\n          <div style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)\">measured, not written<\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:20px;margin-top:8px\">212 <span style=\"font-size:13px;color:var(--dim)\">games running this<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px\">68% of identified codebases · recomputed hourly<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">versions in the wild<\u002Fdiv>\n          <div style=\"display:grid;gap:7px;margin-top:10px;font-family:var(--mono);font-size:12px\">\n            <div style=\"display:flex;justify-content:space-between\"><span>1.8.8<\u002Fspan><span style=\"color:var(--dim)\">141<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span>1.8.7<\u002Fspan><span style=\"color:var(--dim)\">44<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span>1.8.5 and older<\u002Fspan><span style=\"color:var(--warn)\">19<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--faint)\">version not offered<\u002Fspan><span style=\"color:var(--faint)\">8<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">capabilities, observed across those games<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;margin-top:10px;font-family:var(--mono);font-size:12px\">\n            <div style=\"display:flex;justify-content:space-between\"><span>MSSP<\u002Fspan><span style=\"color:var(--accent)\">● 96%<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span>TLS<\u002Fspan><span style=\"color:var(--accent)\">● 38%<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span>GMCP<\u002Fspan><span style=\"color:var(--dim)\">● 41%<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span>MCCP2<\u002Fspan><span style=\"color:var(--dim)\">● 72%<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.5\">a capability the codebase supports but most operators leave off shows here as a low percentage — that gap is useful to a maintainer and appears nowhere else<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--hair);padding-top:14px\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">on client pages instead<\u002Fdiv>\n          <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:8px\">The same panel carries a screen-reader column — tested, dated, and named to the reader and version tested. For a hobby with this many blind players, that row is the most consequential fact on a client page, so it sits at the top of the matrix rather than in an accessibility footnote.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--hair);padding-top:14px\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">links out<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;margin-top:9px;font-size:13px\"><a href=\"#s-reference\">source repository<\u002Fa><a href=\"#s-reference\">the 212 games →<\u002Fa><a href=\"#s-reference\">protocols it implements<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"color:var(--faint);font-size:12px;line-height:1.65;margin-top:10px;max-width:84ch\">v1 keeps these three catalogues hand-written, and the design assumes that stays true: the prose column is narrow enough for one person to maintain forty pages, and every number beside it arrives without an editor. When release tracking lands (§14), it fills the right column further and the left column does not change.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;\\&quot;dark\\&quot; | \\&quot;light\\&quot;&quot;,&quot;section&quot;:&quot;Presentation&quot;},&quot;defaultDensity&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;comfortable&quot;,&quot;tsType&quot;:&quot;\\&quot;comfortable\\&quot; | \\&quot;compact\\&quot;&quot;,&quot;section&quot;:&quot;Presentation&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    theme: this.props.defaultTheme ?? \"dark\",\n    density: this.props.defaultDensity ?? \"comfortable\",\n    chip: false, cap: false, sheet: false, screen: \"cropped\"\n  };\n\n  heat() {\n    const days = [\"mon\", \"tue\", \"wed\", \"thu\", \"fri\", \"sat\", \"sun\"];\n    const shape = [.10,.05,.02,0,0,0,0,.02,.06,.10,.12,.16,.20,.22,.26,.32,.42,.55,.72,.88,1,.94,.68,.34];\n    const mul = [.72,1,.78,.84,.92,.88,.66];\n    return days.map((day, di) => ({\n      day,\n      cells: shape.map((v, h) => {\n        const gap = (di === 2 && h >= 2 && h <= 13);\n        const n = gap ? null : Math.round(v * mul[di] * 17);\n        let style = \"width:15px;height:15px;border-radius:3px;\";\n        let label;\n        if (gap) {\n          style += \"background-image:repeating-linear-gradient(45deg,var(--border) 0 1px,transparent 1px 4px);border:1px solid var(--hair)\";\n          label = day + \" \" + String(h).padStart(2, \"0\") + \":00 — no data, game unreachable\";\n        } else if (n === 0) {\n          style += \"background:var(--surface-2);border:1px solid var(--hair)\";\n          label = day + \" \" + String(h).padStart(2, \"0\") + \":00 — 0 players, measured\";\n        } else {\n          const p = Math.max(10, Math.round((n / 17) * 100));\n          style += \"background:color-mix(in oklab, var(--accent) \" + p + \"%, var(--surface-2));border:1px solid transparent\";\n          label = day + \" \" + String(h).padStart(2, \"0\") + \":00 — \" + n + \" players average\";\n        }\n        const styleSm = style.replace(\"width:15px;height:15px;border-radius:3px;\", \"width:12px;height:12px;border-radius:2px;flex:none;\");\n        return { style, styleSm, label, hour: h };\n      })\n    }));\n  }\n\n  uptime() {\n    const out = [];\n    for (let i = 0; i < 90; i++) {\n      let st = \"up\";\n      if (i === 31 || i === 32) st = \"unreachable\";\n      else if (i === 30 || i === 33 || i === 58) st = \"degraded\";\n      else if (i >= 71 && i <= 72) st = \"unreachable\";\n      let style = \"flex:1 1 0;min-width:2px;border-radius:2px;\";\n      let label;\n      if (st === \"up\") { style += \"height:26px;background:color-mix(in oklab, var(--accent) 62%, var(--surface-2))\"; label = \"day -\" + (89 - i) + \" · up\"; }\n      else if (st === \"degraded\") { style += \"height:14px;align-self:flex-end;background:var(--warn)\"; label = \"day -\" + (89 - i) + \" · degraded · handshake stalled\"; }\n      else { style += \"height:26px;background-image:repeating-linear-gradient(45deg,var(--danger) 0 1px,transparent 1px 4px);border:1px solid var(--danger)\"; label = \"day -\" + (89 - i) + \" · unreachable · connection refused\"; }\n      out.push({ style, label });\n    }\n    return out;\n  }\n\n  series(vals) {\n    return vals.map((v, i) => (20 + i * (480 / (vals.length - 1))).toFixed(1) + \",\" + (170 - (v / 60) * 150).toFixed(1)).join(\" \");\n  }\n\n  graph() {\n    const ring = [\n      { id: \"Ashen Court\", state: \"up\" }, { id: \"Corvid Falls\", state: \"new\" },\n      { id: \"Nine Bells\", state: \"up\" }, { id: \"Hollowmere\", state: \"up\" },\n      { id: \"Salt & Cinder\", state: \"dark\" }, { id: \"Wrenmoor\", state: \"up\" },\n      { id: \"Amber Coast\", state: \"up\" }, { id: \"Gaslight Row\", state: \"dark\" },\n      { id: \"The Long Sleep\", state: \"new\" }, { id: \"Verdigris\", state: \"dark\" }\n    ];\n    const cx = 260, cy = 150, r = 108;\n    const nodes = ring.map((n, i) => {\n      const a = (i / ring.length) * Math.PI * 2 - Math.PI / 2;\n      const fill = n.state === \"dark\" ? \"var(--surface-2)\" : n.state === \"new\" ? \"var(--accent)\" : \"color-mix(in oklab, var(--accent) 55%, var(--surface-2))\";\n      const stroke = n.state === \"dark\" ? \"var(--border)\" : \"transparent\";\n      const dash = n.state === \"dark\" ? \"3 2\" : \"0\";\n      const anchor = Math.cos(a) < -0.1 ? \"end\" : Math.cos(a) > 0.1 ? \"start\" : \"middle\";\n      const tx = anchor === \"end\" ? \"-100%\" : anchor === \"start\" ? \"0\" : \"-50%\";\n      const lx = cx + Math.cos(a) * (r + 15), ly = cy + Math.sin(a) * (r + 15);\n      const labelStyle = \"position:absolute;left:\" + (lx / 520 * 100).toFixed(2) + \"%;top:\" + (ly / 300 * 100).toFixed(2) +\n        \"%;transform:translate(\" + tx + \",-50%);font-size:11.5px;line-height:1.2;color:var(--dim);white-space:nowrap;pointer-events:none\";\n      return { ...n, x: +(cx + Math.cos(a) * r).toFixed(1), y: +(cy + Math.sin(a) * r).toFixed(1), rad: n.state === \"new\" ? 8 : 6.5, fill, stroke, dash, labelStyle };\n    });\n    const pairs = [[0,1],[0,2],[0,3],[0,4],[2,5],[2,6],[3,7],[6,8],[5,9],[1,8]];\n    const edges = pairs.map(([a, b]) => ({\n      x1: nodes[a].x, y1: nodes[a].y, x2: nodes[b].x, y2: nodes[b].y,\n      stroke: nodes[b].state === \"dark\" ? \"var(--border)\" : \"var(--hair)\"\n    }));\n    return { nodes, edges };\n  }\n\n  renderVals() {\n    const t = this.state.theme, d = this.state.density;\n    const facetCount = 4;\n    const g = this.graph();\n    return {\n      tlsLine: this.series([8, 11, 14, 18, 21, 25, 28, 31]),\n      utfLine: this.series([30, 34, 38, 43, 47, 50, 52, 54]),\n      gmcpLine: this.series([18, 20, 23, 26, 29, 31, 33, 35]),\n      graphNodes: g.nodes,\n      graphEdges: g.edges,\n      heatRows: this.heat(),\n      uptimeBars: this.uptime(),\n      chipOpen: this.state.chip,\n      capOpen: this.state.cap,\n      sheetOpen: this.state.sheet,\n      screenMode: this.state.screen,\n      screenCropped: this.state.screen === \"cropped\",\n      screenLabel: this.state.screen === \"cropped\" ? \"show all 47 rows\" : \"crop to 24 rows\",\n      screenBoxStyle: this.state.screen === \"cropped\"\n        ? \"max-height:270px;overflow:hidden;position:relative\"\n        : \"max-height:520px;overflow:auto;position:relative\",\n      toggleChip: () => this.setState(s => ({ chip: !s.chip })),\n      toggleCap: () => this.setState(s => ({ cap: !s.cap })),\n      openSheet: () => this.setState({ sheet: true }),\n      closeSheet: () => this.setState({ sheet: false }),\n      toggleScreen: () => this.setState(s => ({ screen: s.screen === \"cropped\" ? \"full\" : \"cropped\" })),\n      facetCount,\n      theme: t, density: d,\n      themeLabel: t === \"dark\" ? \"dark\" : \"light\",\n      densityLabel: d === \"comfortable\" ? \"comfortable\" : \"compact\",\n      toggleTheme: () => this.setState(s => ({ theme: s.theme === \"dark\" ? \"light\" : \"dark\" })),\n      toggleDensity: () => this.setState(s => ({ density: s.density === \"comfortable\" ? \"compact\" : \"comfortable\" }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
