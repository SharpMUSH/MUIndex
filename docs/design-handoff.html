var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">05 — page templates<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">Home, listing, game page — desktop and mobile<\u002Fh2>\n  <p style=\"max-width:74ch;margin-top:12px;color:var(--dim);font-size:14px;line-height:1.7;text-wrap:pretty\">Navigation is four catalogues plus the dashboard, but games outweigh the rest by two orders of magnitude, so games are the default route: <span style=\"font-family:var(--mono);color:var(--text)\">/g/tidewater-nights<\u002Fspan> at the short path, and clients, codebases and protocols namespaced beneath <span style=\"font-family:var(--mono)\">/clients/<\u002Fspan>, <span style=\"font-family:var(--mono)\">/code/<\u002Fspan>, <span style=\"font-family:var(--mono)\">/protocol/<\u002Fspan>. Archived games keep the same URL forever; there is no <span style=\"font-family:var(--mono)\">/archive/<\u002Fspan> prefix, because a moved permalink is a broken one.<\u002Fp>\n\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:26px\">home — the feeds are the front page<\u002Fdiv>\n  <div style=\"margin-top:10px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg)\">\n    <div style=\"display:flex;align-items:center;gap:20px;padding:0 18px;height:52px;background:var(--surface-3);border-bottom:1px solid var(--hair)\">\n      <span style=\"font-family:var(--mono);font-size:14px\">mu<span style=\"color:var(--accent)\">*<\u002Fspan>index<\u002Fspan>\n      <span style=\"font-size:13px;color:var(--text);border-bottom:2px solid var(--accent);padding-bottom:2px\">games<\u002Fspan>\n      <span style=\"font-size:13px;color:var(--dim)\">clients<\u002Fspan>\n      <span style=\"font-size:13px;color:var(--dim)\">codebases<\u002Fspan>\n      <span style=\"font-size:13px;color:var(--dim)\">protocols<\u002Fspan>\n      <span style=\"font-size:13px;color:var(--dim)\">ecosystem<\u002Fspan>\n      <span style=\"margin-left:auto;font-size:12.5px;color:var(--dim)\">sign in to claim a game<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:34px 30px 26px;border-bottom:1px solid var(--hair)\">\n      <h3 style=\"font-size:28px;font-weight:600;letter-spacing:-.015em;max-width:22ch\">Every game here was checked by a machine, and every fact says when.<\u002Fh3>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-top:18px;max-width:560px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 13px\">\n        <span style=\"font-family:var(--mono);color:var(--faint)\">⌕<\u002Fspan>\n        <span style=\"font-size:14px;color:var(--faint);flex:1\">search 1,213 games — name, theme, codebase, host<\u002Fspan>\n        <span style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.14em;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:3px 6px\">/<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:22px;margin-top:18px;font-family:var(--mono);font-size:12px;color:var(--dim)\">\n        <span><span style=\"color:var(--text)\">1,213<\u002Fspan> games known<\u002Fspan>\n        <span><span style=\"color:var(--accent)\">● 61<\u002Fspan> with players on right now<\u002Fspan>\n        <span><span style=\"color:var(--text)\">310<\u002Fspan> reachable this week<\u002Fspan>\n        <span style=\"color:var(--faint)\">last probe finished 4m ago<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair)\">\n      <div style=\"background:var(--bg);padding:20px\">\n        <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">newly discovered<\u002Fdiv>\n        <div style=\"display:grid;gap:14px;margin-top:14px\">\n justify-content:space-between;gap:10px\"><span style=\"color:var(--dim)\">genre<\u002Fspan><span>Modern Supernatural <span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">◇ mssp 2w<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--dim)\">codebase<\u002Fspan><span>PennMUSH 1.8.8 <span style=\"font-family:var(--mono);font-size:11px;color:var(--accent)\">● banner 4m<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--dim)\">created<\u002Fspan><span>2009 <span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">◇ mssp 6y<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--dim)\">language<\u002Fspan><span>English <span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">◇ mssp 6y<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--dim)\">rp enforcement<\u002Fspan><span style=\"color:var(--faint)\">— not stated<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;padding:12px;border:1px dashed var(--border);border-radius:var(--radius);font-size:12px;color:var(--faint);line-height:1.6\">Six of these fields have not changed since 2019. Nothing here is wrong — it is just old, and the page says so rather than presenting it as current.<\u002Fdiv>\n\n        <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:22px\">points here / points there<\u002Fdiv>\n        <div style=\"font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.9\">Ashen Court → <span style=\"color:var(--text)\">this game<\u002Fspan><br>this game → Corvid Falls, Nine Bells<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"color:var(--faint);font-size:12px;line-height:1.65;margin-top:10px;max-width:80ch\">Revision to §4.4: the connect screen is no longer the hero. <span style=\"color:var(--dim)\">The game is the hero<\u002Fspan> — mark, name, its own one-line description, the paragraph it wrote about itself, and the address you connect to, all above the fold and in that order. The ANSI art follows immediately under the label “what you see when you connect”, which is what it actually is: the first piece of evidence, not the masthead. Two reasons this is the better order. A reader arriving from search needs to know what the game <em>is<\u002Fem> in one glance, and forty lines of box-drawing does not answer that. And the art is the one element we cannot control — leading with it hands the top of every page to whatever the server happens to send, including the blank and hostile cases. The mark falls back to the initials plate shown here until an owner claims the game and uploads one; it is never a generated avatar.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--gap);margin-top:26px\">\n    <div>\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)\">archived — same url, no alarm<\u002Fdiv>\n      <div style=\"margin-top:10px;border:1px solid var(--hair);border-radius:var(--radius-lg);background:var(--surface);padding:20px;box-shadow:var(--shadow)\">\n        <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n          <h3 style=\"font-size:22px;font-weight:600;color:var(--dim)\">Gaslight Row<\u002Fh3>\n          <span style=\"font-family:var(--kick);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border:1px solid var(--border);border-radius:99px;padding:3px 8px\">archived<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:1 Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:3px\">● 14 on <span style=\"color:var(--faint)\">· pennmush · tls ●<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--dim);margin-top:5px;line-height:1.5\">Modern-day supernatural roleplay in a harbour city.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--hair);margin-top:12px;padding-top:12px\">\n          <div style=\"font-size:16px;font-weight:600\">Ashen Court<\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:3px\">● 9 on <span style=\"color:var(--faint)\">· evennia · tls ●<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--dim);margin-top:5px;line-height:1.5\">Courtly intrigue, low fantasy. Application required.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--hair);margin-top:12px;padding-top:12px\">\n          <div style=\"font-size:16px;font-weight:600\">Wrenmoor<\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:3px\">– count unknown <span>· rhostmush<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--dim);margin-top:5px;line-height:1.5\">Pastoral folk-horror RP.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute;left:0;right:0;bottom:0;padding:12px 14px;background:var(--surface-3);border-top:1px solid var(--hair);display:flex;gap:10px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ openSheet }}\" style=\"flex:1;min-height:44px;font:inherit;font-size:14px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);cursor:pointer\">Filters · <span style=\"color:var(--accent)\">2<\u002Fspan><\u002Fbutton>\n        <button type=\"button\" style=\"min-height:44px;font:inherit;font-size:14px;background:none;border:1px solid var
