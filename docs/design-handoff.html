document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ion:underline;text-underline-offset:3px}\nh1,h2,h3,h4,p,ul,ol{margin:0}\ntable{border-collapse:collapse}\n@keyframes muPulse{0%,100%{opacity:1}50%{opacity:.45}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div data-theme=\"{{ theme }}\" data-density=\"{{ density }}\" style=\"min-height:100vh;background:var(--bg);color:var(--text)\">\n\n<header style=\"position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;padding:0 var(--cpad);height:56px;background:var(--surface-3);border-bottom:1px solid var(--hair)\">\n  <div style=\"font-family:var(--mono);font-size:15px;color:var(--text);letter-spacing:.01em\">mu<span style=\"color:var(--accent)\">*<\u002Fspan>index<\u002Fdiv>\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">design handoff · 2026-07-30<\u002Fdiv>\n  <nav style=\"display:flex;gap:14px;margin-left:auto;font-size:12px;color:var(--dim);flex-wrap:wrap\">\n    <a href=\"#s-identity\" style=\"color:var(--dim)\">identity<\u002Fa>\n    <a href=\"#s-type\" style=\"color:var(--dim)\">type<\u002Fa>\n    <a href=\"#s-colour\" style=\"color:var(--dim)\">colour<\u002Fa>\n    <a href=\"#s-ansi\" style=\"color:var(--dim)\">ansi<\u002Fa>\n    <a href=\"#s-components\" style=\"color:var(--dim)\">components<\u002Fa>\n    <a href=\"#s-facets\" style=\"color:var(--dim)\">facets<\u002Fa>\n    <a href=\"#s-pages\" style=\"color:var(--dim)\">pages<\u002Fa>\n    <a href=\"#s-states\" style=\"color:var(--dim)\">states<\u002Fa>\n    <a href=\"#s-a11y\" style=\"color:var(--dim)\">a11y<\u002Fa>\n    <a href=\"#s-claim\" style=\"color:var(--dim)\">claim<\u002Fa>\n    <a href=\"#s-owner\" style=\"color:var(--dim)\">owner<\u002Fa>\n    <a href=\"#s-ecosystem\" style=\"color:var(--dim)\">ecosystem<\u002Fa>\n    <a href=\"#s-crawler\" style=\"color:var(--dim)\">crawler<\u002Fa>\n    <a href=\"#s-reference\" style=\"color:var(--dim)\">reference<\u002Fa>\n  <\u002Fnav>\n  <div style=\"display:flex;gap:6px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" style=\"font-family:var(--kick);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2);color:var(--dim);cursor:pointer\">{{ themeLabel }}<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ toggleDensity }}\" style=\"font-family:var(--kick);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2);color:var(--dim);cursor:pointer\">{{ densityLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"s-identity\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.6) var(--cpad) var(--cpad)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">00 — identity<\u002Fdiv>\n  <h1 style=\"font-size:34px;font-weight:600;letter-spacing:-.015em;margin-top:10px;max-width:24ch\">A register of record for the MU* hobby.<\u002Fh1>\n  <p style=\"max-width:64ch;margin-top:14px;color:var(--dim);font-size:15px;line-height:1.7;text-wrap:pretty\">Working name <span style=\"font-family:var(--mono);color:var(--text)\">MuIndex<\u002Fspan>, kept throughout these designs. Tone is <span style=\"color:var(--text)\">archival and institutional<\u002Fspan>: the site is a public record of measurement, not a hobby storefront. Nothing on it is enthusiastic on the reader's behalf — the data is the personality.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--gap);margin-top:26px\">\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">positioning line<\u002Fdiv>\n      <p style=\"margin-top:12px;font-size:19px;line-height:1.45;letter-spacing:-.01em\">Every game here was checked by a machine, and every fact says when.<\u002Fp>\n      <p style=\"margin-top:12px;color:var(--faint);font-size:12px;line-height:1.6\">Alternates held in reserve: “We connect to these games so you do not have to guess.” / “A directory that measures instead of asking.” No jargon, no “MSSP”, no “crawler” in the line itself.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">mark &amp; motif<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-top:14px\">\n        <div style=\"font-family:var(--mono);font-size:28px;letter-spacing:.01em\">mu<span style=\"color:var(--accent)\">*<\u002Fspan>index<\u002Fdiv>\n        <div style=\"width:34px;height:34px;border:1px solid var(--border);border-radius:var(--radius);display:grid;place-items:center;font-family:var(--mono);font-size:19px;color:var(--accent);background:var(--surface-3)\">*<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:14px;color:var(--faint);font-size:12px;line-height:1.6\">The whole terminal nod is one character: the <span style=\"font-family:var(--mono);color:var(--text)\">*<\u002Fspan> of MU*, set in the mono face and carrying the only accent hue. Favicon is that glyph alone. No CRT scanlines, no ASCII banner, no blinking cursor in the chrome — monospace appears only where the machine is literally speaking (connect screens, WHO, capability names, timestamps).<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">naming note<\u002Fdiv>\n      <p style=\"margin-top:12px;color:var(--dim);font-size:13px;line-height:1.7\">Kept as the working name per direction. If it is replaced, the constraint set is: reads MU* not MUD, one or two syllables before a common suffix, and survives being said aloud on a Discord voice call. Candidates that satisfy the brief's tests: <span style=\"color:var(--text)\">Starbase<\u002Fspan> (register of ports), <span style=\"color:var(--text)\">Portmap<\u002Fspan>, <span style=\"color:var(--text)\">Softcode.dir<\u002Fspan>, <span style=\"color:var(--text)\">Nightwatch<\u002Fspan>. All four are recorded as options, none is proposed as a decision here.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:22px;padding:16px 18px;border:1px solid var(--accent-ring);background:var(--accent-tint);border-radius:var(--radius-lg)\">\n    <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">the one rule the visual system exists to serve<\u002Fdiv>\n    <p style=\"margin-top:10px;font-size:14px;line-height:1.7;color:var(--text);max-width:88ch\">Accent green means <span style=\"font-family:var(--mono)\">measured<\u002Fspan>. Amber means <span style=\"font-family:var(--mono)\">declared, unverified, or ageing<\u002Fspan>. Absence of colour means <span style=\"font-family:var(--mono)\">unknown<\u002Fspan>. That mapping is fixed site-wide and never used decoratively — which is also why the accent is not spent on buttons, links in body copy, or brand flourish.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-type\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">01 — type<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">Three faces, one of them load-bearing<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--gap);margin-top:20px\">\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">hanken grotesk · chrome<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:600;letter-spacing:-.015em;margin-top:12px\">Tidewater Nights<\u002Fdiv>\n      <div style=\"color:var(--dim);font-size:14px;line-height:1.65;margin-top:8px\">Body copy at 14/1.65. Headings 600. Page titles 26px at −0.01em. Nothing above 34px anywhere on the site; this is a reference work, not a landing page.<\u002Fdiv>\n      <div style=\"margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--faint)\">34 · 26 · 19 · 15 · 14 · 13 · 12<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">cascadia mono · the machine speaking<\u002Fdiv>\n      <div style=\"font-family:var(--mono);font-size:13.5px;line-height:1.6;margin-top:12px;color:var(--text)\">┌─ WHO ────────────────┐<br>│ Kestrel      2h  IC  │<br>│ Vera         12m OOC │<br>└──────────────────────┘<\u002Fdiv>\n      <div style=\"color:var(--faint);font-size:12px;line-height:1.6;margin-top:12px\">13.5/1.6, ligatures and contextual alternates <span style=\"font-family:var(--mono)\">off<\u002Fspan> so columns stay square. Renders CP437 and box-drawing, which is non-negotiable for connect screens. Also carries timestamps, capability names, ports and hostnames — anything a machine emitted or a machine reads.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">jetbrains mono · kickers only<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:14px\">\n        <span style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:4px 9px\">measured<\u002Fspan>\n        <span style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:4px 9px\">declared<\u002Fspan>\n        <span style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:4px 9px\">unclaimed<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"color:var(--faint);font-size:12px;line-height:1.6;margin-top:14px\">10–11px, 0.16em tracked, uppercase. Section labels, table column heads, provenance words. Never running text, never a heading.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-colour\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">02 — colour<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">Both themes are first-class; the accent changes value, never hue<\u002Fh2>\n  <p style=\"max-width:70ch;margin-top:12px;color:var(--dim);font-size:14px;line-height:1.7;text-wrap:pretty\">Dark is the default — the audience reads text games at night and the ANSI region sits inside a dark page without a jarring seam. Light is a paper register: white card on a faintly cool ground, and the phosphor green drops to <span style=\"font-family:var(--mono)\">#04795b<\u002Fspan> so it clears 4.5:1 on white. Same hue, same meaning. Toggle the header control to check every specimen on this page in both.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--gap);margin-top:22px\">\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">ground &amp; lines<\u002Fdiv>\n      <div style=\"display:flex;gap:6px;margin-top:12px\">\n        <div style=\"flex:1;height:44px;border-radius:6px;background:var(--bg);border:1px solid var(--hair)\"><\u002Fdiv>\n        <div style=\"flex:1;height:44px;border-radius:6px;background:var(--surface);border:1px solid var(--hair)\"><\u002Fdiv>\n        <div style=\"flex:1;height:44px;border-radius:6px;background:var(--surface-2);border:1px solid var(--hair)\"><\u002Fdiv>\n        <div style=\"flex:1;height:44px;border-radius:6px;background:var(--surface-3);border:1px solid var(--hair)\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:10px\">bg · surface · raised · recessed. Hairline borders; separation comes from surface steps, not rules.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">text ramp<\u002Fdiv>\n      <div style=\"margin-top:12px;font-size:15px;color:var(--text)\">primary — values and names<\u002Fdiv>\n      <div style=\"margin-top:4px;font-size:14px;color:var(--dim)\">dim — prose and secondary<\u002Fdiv>\n      <div style=\"margin-top:4px;font-size:13px;color:var(--faint)\">faint — provenance, ages, meta<\u002Fdiv>\n      <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:12px\">Three steps. Ages live at the faint step so a page of provenance reads as texture, not noise.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">state colours + their glyphs<\u002Fdiv>\n      <div style=\"display:grid;gap:8px;margin-top:12px;font-size:13px\">\n        <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-family:var(--mono);color:var(--accent);width:14px\">●<\u002Fspan><span style=\"color:var(--accent)\">measured present<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-family:var(--mono);color:var(--dim);width:14px\">✕<\u002Fspan><span style=\"color:var(--dim)\">measured absent<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-family:var(--mono);color:var(--warn);width:14px\">◇<\u002Fspan><span style=\"color:var(--warn)\">declared only<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-family:var(--mono);color:var(--faint);width:14px\">–<\u002Fspan><span style=\"color:var(--faint)\">unknown / no data<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:12px\">Glyph carries the state; colour reinforces it. Colour-blind, greyscale-printed and Lynx renderings all survive.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-ansi\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">03 — the ansi answer<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">Foreign colour is quoted, not hosted<\u002Fh2>\n  <p style=\"max-width:72ch;margin-top:12px;color:var(--dim);font-size:14px;line-height:1.7;text-wrap:pretty\">A connect screen arrives with 16-colour, 256-colour or truecolor SGR we do not control, and it will clash with any palette. So the site does not try to host it. Rendered ANSI always sits inside a <span style=\"color:var(--text)\">quotation frame<\u002Fspan>: its own fixed black ground and its own locked 16-colour table in <em>both<\u002Fem> themes, a hairline border, and a caption strip stating source, size and colour depth. Inside the frame, arbitrary colour is expected. Outside it, the site keeps its two hues. Nothing bleeds either way — no ANSI colour is ever sampled for chrome, and site colour never tints the art.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--gap);margin-top:20px\">\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">locked 16-colour table<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:12px\">\n        <div style=\"height:22px;border-radius:3px;background:#000;border:1px solid #2a2a2a\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#a00\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#0a0\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#a50\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#00a\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#a0a\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#0aa\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#aaa\"><\u002Fdiv>\n        <div style=\"height:22px;border-radius:3px;background:#555\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#f55\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#5f5\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#ff5\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#55f\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#f5f\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#5ff\"><\u002Fdiv><div style=\"height:22px;border-radius:3px;background:#fff\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:12px\">One table, theme-independent, close to xterm. Games that assume a dark terminal — nearly all of them — look correct. Truecolor and 256 pass through untouched; only the 16 indexed slots are ours to choose.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">contrast floor inside the frame<\u002Fdiv>\n      <div style=\"margin-top:12px;background:#000;border:1px solid var(--border);border-radius:6px;padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.55\">\n        <div style=\"color:#00a\">dark blue on black, as sent — 2.4:1<\u002Fdiv>\n        <div style=\"color:#5f8fff\">the same line, floor applied — 5.6:1<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:12px\">Games do emit unreadable pairs. A per-frame <span style=\"color:var(--text)\">“raise contrast”<\u002Fspan> control lifts foreground luminance until every run clears 4.5:1, leaving hue alone. Off by default — the default view is what the server actually sent — and remembered per reader.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-components\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">04 — signature components<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">The seven pieces that carry the product<\u002Fh2>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:var(--gap);margin-top:22px\">\n\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">4.1 — provenance chip<\u002Fdiv>\n      <h3 style=\"font-size:17px;font-weight:600;margin-top:8px\">Resting: a glyph and two characters<\u002Fh3>\n      <p style=\"color:var(--dim);font-size:13px;line-height:1.65;margin-top:8px;text-wrap:pretty\">The chip is not a box. At rest it is the value, one state glyph, and a relative age in faint mono — no border, no fill, no chip shape, because it appears hundreds of times. It becomes a control on hover (dotted underline) and opens a full record on click or Enter.<\u002Fp>\n      <div style=\"margin-top:16px;padding:16px;background:var(--surface-3);border:1px solid var(--hair);border-radius:var(--radius);display:grid;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px;font-size:15px\">\n          <span>Roleplay-enforced<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleChip }}\" style=\"background:none;border:0;padding:0;cursor:pointer;font:inherit;display:inline-flex;align-items:baseline;gap:5px\" aria-expanded=\"false\">\n            <span style=\"font-family:var(--mono);font-size:12px;color:var(--accent)\">●<\u002Fspan>\n            <span style=\"font-family:var(--mono);font-size:11.5px;color:var(--faint);border-bottom:1px dotted var(--border)\">4m<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:8px;font-size:15px\">\n          <span style=\"color:var(--dim)\">GMCP supported<\u002Fspan>\n          <span style=\"font-family:var(--mono);font-size:12px;color:var(--warn)\">◇<\u002Fspan>\n          <span style=\"font-family:var(--mono);font-size:11.5px;color:var(--warn)\">6y<\u002Fspan>\n          <span style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:2px 7px\">declared<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:8px;font-size:15px\">\n          <span style=\"color:var(--faint)\">Player count<\u002Fspan>\n          <span style=\"font-family:var(--mono);font-size:12px;color:var(--faint)\">–<\u002Fspan>\n          <span style=\"font-family:var(--mono);font-size:11.5px;color:var(--faint)\">who unparseable<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ chipOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:12px;border:1px solid var(--accent-ring);background:var(--surface-2);border-radius:var(--radius);padding:14px;font-size:12.5px\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">expanded record<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:10px;font-family:var(--mono);font-size:12px\">\n            <span style=\"color:var(--faint)\">value<\u002Fspan><span>enforced (owner-supplied)<\u002Fspan>\n            <span style=\"color:var(--faint)\">source<\u002Fspan><span>owner · claimed 2025-11-02<\u002Fspan>\n            <span style=\"color:var(--faint)\">first seen<\u002Fspan><span>2025-11-02 18:41 UTC<\u002Fspan>\n            <span style=\"color:var(--faint)\">confirmed<\u002Fspan><span>2026-07-30 14:12 UTC (4 minutes ago)<\u002Fspan>\n            <span style=\"color:var(--faint)\">competing<\u002Fspan><span style=\"color:var(--warn)\">mssp GENRE “RP-lite” · last confirmed 2019-03-11<\u002Fspan>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleChip }}\" style=\"margin-top:12px;font:inherit;font-size:12px;background:none;border:1px solid var(--border);color:var(--dim);border-radius:var(--radius);padding:5px 10px;cursor:pointer\">close<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <p style=\"color:var(--faint);font-size:12px;line-height:1.65;margin-top:12px\">Age renders as relative time, never as a decay bar — a bar invents precision the reader cannot use. Decay is expressed by the glyph flipping to <span style=\"font-family:var(--mono);color:var(--warn)\">◇<\u002Fspan> and the age turning amber once a field passes its own expected-refresh window (hours for presence, a year for hand-typed MSSP prose). Absolute UTC is in the expanded record and the <span style=\"font-family:var(--mono)\">title<\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">4.2 — capability matrix<\u002Fdiv>\n      <h3 style=\"font-size:17px;font-weight:600;margin-top:8px\">Two columns, because there are two claims<\u002Fh3>\n      <p style=\"color:var(--dim);font-size:13px;line-height:1.65;margin-top:8px;text-wrap:pretty\">Measured and declared are separate columns, never merged into one badge. Rows sort disagreements to the top and mark them in the row itself, so the interesting case cannot be scrolled past.<\u002Fp>\n      <sc-raw-table style=\"width:100%;margin-top:14px;font-size:13px\">\n        <sc-raw-thead>\n          <sc-raw-tr style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:left\">\n            <sc-raw-th style=\"font-weight:400;padding:0 0 8px\">capability<\u002Fsc-raw-th>\n            <sc-raw-th style=\"font-weight:400;padding:0 0 8px;width:96px\">measured<\u002Fsc-raw-th>\n            <sc-raw-th style=\"font-weight:400;padding:0 0 8px;width:96px\">declared<\u002Fsc-raw-th>\n            <sc-raw-th style=\"font-weight:400;padding:0 0 8px;width:56px\">age<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody style=\"font-family:var(--mono);font-size:12.5px\">\n          <sc-raw-tr style=\"background:var(--warn-tint)\">\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair)\"><button type=\"button\" sc-camel-on-click=\"{{ toggleCap }}\" style=\"font:inherit;background:none;border:0;padding:0;color:var(--text);cursor:pointer;border-bottom:1px dotted var(--warn)\">GMCP<\u002Fbutton><\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--dim)\">✕ absent<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--warn)\">◇ claimed<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--warn)\">6y<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair)\">TLS<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--accent)\">● offered<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--faint)\">– silent<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--faint)\">4m<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair)\">MCCP2<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--accent)\">● offered<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--accent)\">● claimed<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--faint)\">4m<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair)\">NAWS<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--accent)\">● offered<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--faint)\">– silent<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--faint)\">4m<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--faint)\">MSDP<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--dim)\">✕ absent<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--faint)\">– silent<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:var(--rowpy) 0;border-top:1px solid var(--hair);color:var(--faint)\">4m<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <sc-if value=\"{{ capOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:12px;border:1px solid var(--warn);background:var(--warn-tint);border-radius:var(--radius);padding:14px;font-size:12.5px;line-height:1.7\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--warn)\">they disagree<\u002Fdiv>\n          <p style=\"margin-top:8px;color:var(--text)\">The game's MSSP record says <span style=\"font-family:var(--mono)\">GMCP 1<\u002Fspan>, last changed 2020-04-18. In 214 handshakes since, including one 4 minutes ago, the server has never sent <span style=\"font-family:var(--mono)\">IAC WILL GMCP<\u002Fspan>.<\u002Fp>\n          <p style=\"margin-top:8px;color:var(--dim)\">This is usually a hand-typed MSSP field left over from a codebase upgrade, not a lie. Clients should not rely on GMCP here.<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleCap }}\" style=\"margin-top:10px;font:inherit;font-size:12px;background:none;border:1px solid var(--border);color:var(--dim);border-radius:var(--radius);padding:5px 10px;cursor:pointer\">close<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <p style=\"color:var(--faint);font-size:12px;line-height:1.65;margin-top:12px\">Full page shows all ~20 rows; disagreements first, then measured-present, then absent, then unknown. A count sits in the section head — “<span style=\"font-family:var(--mono)\">1 of 20 capabilities disagrees with what the game declares<\u002Fspan>” — so the fact survives collapse and screen readers alike.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:var(--gap);margin-top:var(--gap)\">\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">4.3 — activity heatmap<\u002Fdiv>\n      <h3 style=\"font-size:17px;font-weight:600;margin-top:8px\">When is anyone actually on?<\u002Fh3>\n      <p style=\"color:var(--dim);font-size:13px;line-height:1.65;margin-top:8px;text-wrap:pretty\">Day-of-week × hour, in <span style=\"color:var(--text)\">your<\u002Fspan> timezone, stated in words above the grid so the answer arrives before the graphic does.<\u002Fp>\n      <p style=\"margin-top:14px;font-size:14.5px;line-height:1.6;color:var(--text)\">Busiest <span style=\"color:var(--accent)\">Tuesday and Friday, 19:00–23:00<\u002Fspan>. Reliably quiet on weekday mornings. Twelve hours on Wednesday could not be measured.<\u002Fp>\n      <div style=\"font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:4px\">times shown in Europe/London · 8-week rolling average<\u002Fdiv>\n      <div style=\"margin-top:14px;overflow-x:auto\">\n        <div style=\"display:grid;gap:2px;min-width:440px\">\n          <sc-for list=\"{{ heatRows }}\" as=\"row\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;gap:2px;align-items:center\">\n              <div style=\"width:30px;font-family:var(--kick);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)\">{{ row.day }}<\u002Fdiv>\n              <sc-for list=\"{{ row.cells }}\" as=\"c\" hint-placeholder-count=\"24\">\n                <div title=\"{{ c.label }}\" style=\"{{ c.style }}\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;gap:2px;margin-left:30px;font-family:var(--mono);font-size:9px;color:var(--faint)\">\n            <span style=\"width:15px\">0<\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\">6<\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\">12<\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\">18<\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\"><\u002Fspan><span style=\"width:15px\">23<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:11.5px;color:var(--dim);align-items:center\">\n        <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:13px;height:13px;border-radius:3px;background:var(--surface-2);border:1px solid var(--hair)\"><\u002Fspan>zero, measured<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:13px;height:13px;border-radius:3px;border:1px solid var(--hair);background-image:repeating-linear-gradient(45deg,var(--border) 0 1px,transparent 1px 4px)\"><\u002Fspan>no data<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:13px;height:13px;border-radius:3px;background:color-mix(in oklab,var(--accent) 30%,var(--surface-2))\"><\u002Fspan><span style=\"width:13px;height:13px;border-radius:3px;background:color-mix(in oklab,var(--accent) 100%,var(--surface-2))\"><\u002Fspan>1 → 17 players<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"color:var(--faint);font-size:12px;line-height:1.65;margin-top:12px\">Flat fill versus hatched outline is the whole §0.3 constraint, and it holds in greyscale. The grid is one <span style=\"font-family:var(--mono)\">table<\u002Fspan> with row and column headers, arrow-key navigable; the sentence above is the accessible summary, and a per-day text row (“Tue — quiet until 17:00, peak 14 at 21:00”) is available under a “read as text” disclosure rather than 168 announced cells.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">4.4 — connect-screen renderer<\u002Fdiv>\n      <h3 style=\"font-size:17px;font-weight:600;margin-top:8px\">Cropped, never scaled<\u002Fh3>\n      <p style=\"color:var(--dim);font-size:13px;line-height:1.65;margin-top:8px;text-wrap:pretty\">The art is a fixed character grid; scaling it breaks the grid and blurs the box-drawing. So: render at a fixed 80 columns, crop vertically to 24 rows with an honest fade and a row count, and let the reader open the rest. Below 700px the frame scrolls horizontally rather than shrinking the glyphs.<\u002Fp>\n      <div style=\"margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden\">\n        <div style=\"{{ screenBoxStyle }}\">\n          <div style=\"background:#000;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre;color:#aaa;overflow-x:auto\">\n<div><span style=\"color:#0aa\">    ╔══════════════════════════════════════════════════════════════╗<\u002Fspan><\u002Fdiv>\n<div><span style=\"color:#0aa\">    ║<\u002Fspan>   <span style=\"color:#5ff\">T I D E W A T E R   N I G H T S<\u002Fspan>                            <span style=\"color:#0aa\">║<\u002Fspan><\u002Fdiv>\n<div><span style=\"color:#0aa\">    ║<\u002Fspan>   <span style=\"color:#555\">a harbour city that never quite dries out<\u002Fspan>                  <span style=\"color:#0aa\">║<\u002Fspan><\u002Fdiv>\n<div><span style=\"color:#0aa\">    ╚══════════════════════════════════════════════════════════════╝<\u002Fspan><\u002Fdiv>\n<div> <\u002Fdiv>\n<div>      <span style=\"color:#a50\">~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~<\u002Fspan><\u002Fdiv>\n<div>      <span style=\"color:#fff\">Modern-day supernatural RP.  Est. 2009.  PennMUSH 1.8.8<\u002Fspan><\u002Fdiv>\n<div>      <span style=\"color:#a50\">~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~<\u002Fspan><\u002Fdiv>\n<div> <\u002Fdiv>\n<div>      <span style=\"color:#5f5\">connect<\u002Fspan> &lt;name&gt; &lt;password&gt;     <span style=\"color:#555\">— returning players<\u002Fspan><\u002Fdiv>\n<div>      <span style=\"color:#5f5\">create<\u002Fspan>  &lt;name&gt; &lt;password&gt;     <span style=\"color:#555\">— new characters welcome<\u002Fspan><\u002Fdiv>\n<div>      <span style=\"color:#5f5\">WHO<\u002Fspan>                            <span style=\"color:#555\">— who is on right now<\u002Fspan><\u002Fdiv>\n<div> <\u002Fdiv>\n<div>      <span style=\"color:#f5f\">news<\u002Fspan> · <span style=\"color:#f5f\">policy<\u002Fspan> · <span style=\"color:#f5f\">theme<\u002Fspan>            <span style=\"color:#555\">wiki: tidewater.example<\u002Fspan><\u002Fdiv>\n<div> <\u002Fdiv>\n<div>      <span style=\"color:#555\">staff read +requests daily. be kind, ask first.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ screenCropped }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to bottom,rgba(0,0,0,0),#000)\"><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 12px;background:var(--surface-3);border-top:1px solid var(--hair);font-family:var(--mono);font-size:11px;color:var(--faint)\">\n          <span>as sent by the server<\u002Fspan><span>·<\u002Fspan><span>80×47<\u002Fspan><span>·<\u002Fspan><span>16-colour SGR<\u002Fspan><span>·<\u002Fspan><span>captured 4m ago<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleScreen }}\" style=\"margin-left:auto;font:inherit;background:var(--surface-2);border:1px solid var(--border);color:var(--dim);border-radius:var(--radius);padding:4px 9px;cursor:pointer\">{{ screenLabel }}<\u002Fbutton>\n          <button type=\"button\" style=\"font:inherit;background:var(--surface-2);border:1px solid var(--border);color:var(--dim);border-radius:var(--radius);padding:4px 9px;cursor:pointer\">raise contrast<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px\">\n        <div style=\"border:1px dashed var(--border);border-radius:var(--radius);padding:12px;font-size:12px;color:var(--faint);line-height:1.6\"><span style=\"color:var(--dim)\">suppressed by owner —<\u002Fspan> the frame is replaced by a plain plate at the same height: “the owner asked us not to republish this game's connect screen.” No accusation, no empty box.<\u002Fdiv>\n        <div style=\"border:1px dashed var(--border);border-radius:var(--radius);padding:12px;font-size:12px;color:var(--faint);line-height:1.6\"><span style=\"color:var(--dim)\">blank, tiny or hostile —<\u002Fspan> under 3 non-empty rows, the hero collapses entirely and the page leads with the name and capability summary instead. Over 200 rows, we crop at 24 and say so.<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"color:var(--faint);font-size:12px;line-height:1.65;margin-top:12px\">Screen readers get the stripped text with a preamble — “connect screen, 47 lines, as sent by the server” — and colour codes are never announced. It is a <span style=\"font-family:var(--mono)\">figure<\u002Fspan>, skippable in one keystroke.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:var(--gap);margin-top:var(--gap)\">\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">4.5 — availability strip<\u002Fdiv>\n      <h3 style=\"font-size:17px;font-weight:600;margin-top:8px\">Status-page prior art, with the causes kept<\u002Fh3>\n      <p style=\"color:var(--dim);font-size:13px;line-height:1.65;margin-top:8px;text-wrap:pretty\">Follow the convention — 90 bars, oldest left — because it is genuinely legible and readers already know it. Diverge in two places: degraded is a <em>short<\u002Fem> bar rather than a different colour alone, and unreachable is hatched and outlined so it reads as “absent”, not “red”.<\u002Fp>\n      <div style=\"display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:16px\">\n        <sc-for list=\"{{ uptimeBars }}\" as=\"b\" hint-placeholder-count=\"90\">\n          <div title=\"{{ b.label }}\" style=\"{{ b.style }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:6px\"><span>90 days ago<\u002Fspan><span>today<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;font-size:13px\">\n        <div><div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)\">reachable<\u002Fdiv><div style=\"font-family:var(--mono);font-size:17px;color:var(--accent);margin-top:3px\">95.6%<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)\">longest outage<\u002Fdiv><div style=\"font-family:var(--mono);font-size:17px;margin-top:3px\">2d 4h<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)\">last cause<\u002Fdiv><div style=\"font-family:var(--mono);font-size:17px;color:var(--warn);margin-top:3px\">refused<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"color:var(--faint);font-size:12px;line-height:1.65;margin-top:12px\">“Reachable”, not “uptime” — we measure a socket from one vantage point and should not imply we measured the game. The wording matters more than the graphic.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)\">\n      <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">4.6 — liveness feed cards<\u002Fdiv>\n      <h3 style=\"font-size:17px;font-weight:600;margin-top:8px\">Three registers, one shape<\u002Fh3>\n      <p style=\"color:var(--dim);font-size:13px;line-height:1.65;margin-top:8px;text-wrap:pretty\">Same card, three tones: neutral for discovered, unlit for went dark, and the one moment of genuine warmth the site allows itself for a return.<\u002Fp>\n      <div style=\"display:grid;gap:10px;margin-top:14px\">\n        <div style=\"border:1px solid var(--hair);border-radius:var(--radius);padding:13px 15px;background:var(--surface-3)\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">newly discovered<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:9px;margin-top:7px\"><span style=\"font-size:15px;font-weight:600\">Corvid Falls<\u002Fspan><span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">2h<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:5px\">found via REFERRAL from Ashen Court · answered MSSP on first probe · Evennia<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--hair);border-radius:var(--radius);padding:13px 15px;background:var(--surface-3);opacity:.78\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">went dark<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:9px;margin-top:7px\"><span style=\"font-size:15px;font-weight:600;color:var(--dim)\">Salt &amp; Cinder<\u002Fspan><span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">6d<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:5px\">unreachable since 2026-07-24 · dns nxdomain · page stays, we keep knocking weekly<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--accent-ring);border-radius:var(--radius);padding:13px 15px;background:var(--accent-tint)\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">came back<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:9px;margin-top:7px\"><span style=\"font-size:15px;font-weight:600\">The Long Sleep<\u002Fspan><span style=\"font-family:var(--mono);font-size:11px;color:var(--accent)\">●&nbsp;live<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.5;margin-top:6px\">Answered again after <span style=\"color:var(--accent)\">26 months<\u002Fspan> dark. Three players on within the hour.<\u002Fdiv>\n          <div style=\"font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:5px\">same host, same banner hash — matched to its old page, history intact<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"color:var(--faint);font-size:12px;line-height:1.65;margin-top:12px\">The return card is the only place the site raises its voice, and it earns it: a dark-for-two-years game answering is the thing no incumbent could tell you. It gets a full sentence in body size instead of mono metadata, and it is the one element allowed a 1.4s glow on arrival — suppressed entirely under <span style=\"font-family:var(--mono)\">prefers-reduced-motion<\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s-facets\" style=\"max-width:1320px;margin:0 auto;padding:calc(var(--cpad)*1.2) var(--cpad);border-top:1px solid var(--hair)\">\n  <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">04.7 — the facet panel<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px\">Flagged as the piece most likely to be wrong — so it is designed twice<\u002Fh2>\n  <p style=\"max-width:74ch;margin-top:12px;color:var(--dim);font-size:14px;line-height:1.7;text-wrap:pretty\">The MSSP taxonomy plus derived facets is roughly forty controls, and a reader wants three of them. The panel is therefore <span style=\"color:var(--text)\">ordered by how often a real person needs it<\u002Fspan>, not by the shape of the spec: liveness first, then what kind of game, then how you play it, then the machine facts. Everything past that is behind one disclosure.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:minmax(240px,268px) 1fr;gap:var(--gap);margin-top:22px;align-items:start\">\n    <aside style=\"background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow)\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n        <div style=\"font-family:var(--kick);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">filters · {{ facetCount }}<\u002Fdiv>\n        <a href=\"#s-facets\" style=\"font-size:11.5px;color:var(--dim)\">clear all<\u002Fa>\n        <div style=\"display:grid;gap:7px;margin-top:9px;font-size:13px\">\n          <label style=\"display:flex;align-items:center;gap:9px;cursor:pointer\"><input type=\"checkbox\" checked=\"checked\" style=\"accent-color:var(--accent);width:14px;height:14px\"><span style=\"flex:1\">roleplaying<\u002Fspan><span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">137<\u002Fspan><\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:9px;cursor:pointer\"><input type=\"checkbox\" style=\"accent-color:var(--accent);width:14px;height:14px\"><span style=\"flex:1;color:var(--dim)\">social<\u002Fspan><span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">44<\u002Fspan><\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:9px;cursor:pointer\"><input type=\"checkbox\" style=\"accent-color:var(--accent);width:14px;height:14px\"><span style=\"flex:1;color:var(--dim)\">adventure<\u002Fspan><span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">88<\u002Fspan><\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:9px;opacity:.45\"><input type=\"checkbox\" disabled=\"disabled\" style=\"width:14px;height:14px\"><span style=\"flex:1\">hack and slash<\u002Fspan><span style=\"font-family:var(--mono);font-size:11px\">0<\u002Fspan><\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.5\">zero-count options stay visible and disabled — hiding them hides the shape of the hobby<\u002Fdiv>\n      <\u002Ffieldset>\n\n      <fieldset style=\"border:0;padding:0;margin:18px 0 0;border-top:1px solid var(--hair);padding-top:14px\">\n        <legend style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:0\">connection<\u002Flegend>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-top:9px;padding:7px 9px;background:var(--surface-3);border:1px solid var(--hair);border-radius:var(--radius)\">\n          <span style=\"font-family:var(--mono);font-size:12px;color:var(--accent)\">●<\u002Fspan>\n          <span style=\"font-size:11.5px;color:var(--dim);line-height:1.4\">matching <span style=\"color:var(--text)\">measured<\u002Fspan> support only<\u002Fspan>\n          <span style=\"margin-left:auto;font-size:11px;color:var(--dim);border-bottom:1px dotted var(--border);cursor:pointer\">include declared<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:7px;margin-top:10px;font-size:13px\">\n          <label style=\"display:flex;align-items:center;gap:9px;cursor:pointer\"><input type=\"checkbox\" checked=\"checked\" style=\"accent-color:var(--accent);width:14px;height:14px\"><span style=\"flex:1\">TLS<\u002Fspan><span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">96<\u002Fspan><\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:9px;cursor:pointer\"><input type=\"checkbox\" style=\"accent-color:var(--accent);width:14px;height:14px\"><span style=\"flex:1;color:var(--dim)\">UTF-8 charset<\u002Fspan><span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">122<\u002Fspan><\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:9px;cursor:pointer\"><input type=\"checkbox\" style=\"accent-color:var(--accent);width:14px;height:14px\"><span style=\"flex:1;color:var(--dim)\">GMCP<\u002Fspan><span style=\"font-family:var(--mono);font-size:11px;color:var(--faint)\">73<\u002Fspan><\u002Flabel>\n        <\u002Fdiv>\n      <\u002Ffieldset>\n\n      <button type=\"button\" style=\"width:100%;margin-top:16px;font:inherit;font-size:12.5px;text-align:left;background:var(--surface-2);border:1px solid var(--border);color:var(--dim);border-radius:var(--radius);padding:9px 12px;cursor:pointer\">more filters — codebase, language, size, theme, IP <span style=\"color:var(--faint)\">(28)<\u002Fspan><\u002Fbutton>\n      <p style=\"font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:10px;line-height:1.55\">every facet is a querystring parameter; the panel is a plain GET form and works with scripting off<\u002Fp>\n    <\u002Faside>\n\n    <div>\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--hair)\">\n        <div style=\"font-size:15px\"><span style=\"font-family:var(--mono);color:var(--accent)\">61<\u002Fspan> games<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-left:4px\">\n          <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:4px 8px 4px 10px\">players on now <span style=\"color:var(--faint);cursor:pointer\">✕<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:4px 8px 4px 10px\">active this week <span style=\"color:var(--faint);cursor:pointer\">✕<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:4px 8px 4px 10px\">roleplaying <span style=\"color:var(--faint);cursor:pointer\">✕<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--accent-tint);border:1px solid var(--accent-ring);border-radius:99px;padding:4px 8px 4px 10px\"><span style=\"font-family:var(--mono);color:var(--accent)\">●<\u002Fspan> TLS measured <span style=\"color:var(--faint);cursor:pointer\">✕<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"color:var(--dim);font-size:13.5px;line-height:1.7;margin-top:14px;max-width:70ch;text-wrap:pretty\">Selected filters are repeated as removable chips above the results, so the panel is never the only place the query is visible — that is what makes the mobile sheet safe to close and the back button meaningful. Counts recompute against the current query; the panel never lies about how many games a click will produce.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px\">\n        <div style=\"border:1px solid var(--hair);background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">mobile — the answer<\u002Fdiv>\n          <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:8px\">A sticky bottom bar showing the live result count and the filter count. Tapping opens a full-height sheet of accordions. On mobile the query is <span style=\"color:var(--text)\">staged<\u002Fspan> — nothing re-runs until “show”, because a half-built query on a slow connection is a worse experience than one deliberate apply.<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ openSheet }}\" style=\"margin-top:12px;font:inherit;font-size:12.5px;background:var(--accent-tint);border:1px solid var(--accent-ring);color:var(--text);border-radius:var(--radius);padding:8px 12px;cursor:pointer\">open the mobile sheet →<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--hair);background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">what we deliberately did not build<\u002Fdiv>\n          <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:8px\">No facet search box (forty labels do not need one, and it hides structure). No “smart” reordering of groups by usage — a panel that moves is a panel you cannot learn. No sliders for player count: bands, because the underlying number is an estimate.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--hair);background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)\">\n          <div style=\"font-family:var(--kick);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)\">the find-a-game wizard<\u002Fdiv>\n          <p style=\"font-size:12.5px;color:var(--dim);line-height:1.65;margin-top:8px\">Three plain questions — what do you want to do, when are you online, what do you connect with — that write the same querystring the panel does and then <em>show<\u002Fem> the panel with those boxes ticked. It teaches the facets rather than replacing them.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center\" sc-camel-on-click=\"{{ closeSheet }}\">\n      <div style=\"width:100%;max-width:390px;max-height:88vh;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:16px 16px 84px;position:relative\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;position:sticky;top:-16px;background:var(--bg);padding:6px 0 12px\">\n          <div style=\"font-size:16px;font-weight:600\">Filters<\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ closeSheet }}\" style=\"font:inherit;font-size:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--dim);border-radius:var(--radius);padding:6px 10px;cursor:pointer\">close<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:2px\">\n          <div style=\"display:flex;align-items:center;just
